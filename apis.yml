- aid: gingr:gingr-card-on-file-api
  name: Gingr Card On File API
  description: >-
    The **Card On File** group manages saved payment methods for a parent. Gingr stores tokenized card
    details through its payment gateway integration — raw card numbers are never stored or transmitted
    through the API.


    Use this group to:


    - **List** saved cards for a parent.

    - **Set a default** card to use for auto-billing and deposits.

    - **Delete** a card that is no longer needed.

    - **Initiate card capture** flows for parents who need to add a new card.


    Cards on file are required for certain features such as automatic deposits, membership auto-billing,
    and one-click checkout.
  humanURL: >-
    https://support.gingrapp.com/hc/en-us/articles/25722122517517-Gingr-API-Functions-Reference
  baseURL: https://api.gingr.io/v1
