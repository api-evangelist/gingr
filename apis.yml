- aid: gingr:gingr-config-api
  name: Gingr Config API
  description: >-
    The **Config** group exposes read and write endpoints for all organization-level configuration data
    in Gingr. This includes the lookup tables and settings that everything else depends on — species,
    breeds, booking types, service options, feeding options, immunization types, forms, locations, hours
    of operation, tax rates, areas, disabled dates, and more.


    Typically you will call these endpoints once at startup (or on a periodic refresh) to build local
    caches that your integration can reference when creating bookings, parents, and pets. Most config
    data changes infrequently and is safe to cache for hours or even days.


    Key things to know:


    - **Booking Types** define the kinds of services a location offers (e.g., Boarding, Daycare, Grooming).
    A booking must reference a valid booking type for the target location.

    - **Service Options** are add-ons that can be attached to a booking (e.g., extra walks, nail trim).
    Each service option belongs to a booking type.

    - **Forms** are questionnaires associated with bookings or animals. Form answers are collected during
    the pre-check process.

    - **Areas / Runs** represent physical kennel spaces. Lodging availability and capacity constraints
    live here.

    - **Tax Rates** define the tax rules applied when invoicing. Whether tax is applied to a booking depends
    on organization settings.

    - **Disabled Dates** let you know when a location is closed so you can avoid booking on those days.
  humanURL: >-
    https://support.gingrapp.com/hc/en-us/articles/25722122517517-Gingr-API-Functions-Reference
