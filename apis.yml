- aid: gingr:gingr-parents-api
  name: Gingr Parents API
  description: >-
    The **Parents** group covers everything related to the pet owner — referred to as a **Parent** in
    Gingr. A Parent is the primary account holder who owns one or more animals and makes bookings.


    Use this group to:


    - **Create** new parents during the intake flow (e.g., an online booking portal).

    - **Update** parent profile data such as contact info, address, and custom fields.

    - **Search / list** parents by name, email, phone, and other filters.

    - **Manage memberships** — enroll or cancel a parent's membership plan.

    - **Manage cards on file** — retrieve saved payment methods so you can pre-fill checkout forms.

    - **Handle agreements** — check which digital waivers a parent still needs to sign and mark them as
    signed.


    Important considerations:


    - `email` and `cellPhone` are unique per organization. Attempting to create a duplicate will return
    a `422` validation error.

    - `allowOnlineLogin` controls whether the parent can log in to the Gingr consumer portal. This defaults
    to `false` for API-created parents unless explicitly set.

    - Custom fields (configured per organization) can be passed in the `customFields` object. Field keys
    vary by organization — use the Config `/v1/config` endpoint or contact support to get the key names
    for a specific subdomain.
  humanURL: >-
    https://support.gingrapp.com/hc/en-us/articles/25722122517517-Gingr-API-Functions-Reference
