- aid: gingr:gingr-precheck-api
  name: Gingr Precheck API
  description: >-
    The **Precheck** group handles the digital pre-check-in process for bookings. A pre-check collects
    animal care instructions — feeding, medications, behavioral notes, and custom form answers — before
    the animal arrives for its stay.


    Whether pre-check is required depends on the organization's settings and the booking type. When required,
    a booking cannot be fully confirmed until a pre-check has been submitted.


    Use this group to retrieve the pre-check form definition for a booking and to submit completed form
    answers.
  humanURL: >-
    https://support.gingrapp.com/hc/en-us/articles/25722122517517-Gingr-API-Functions-Reference
  baseURL: https://api.gingr.io/v1
  tags:
