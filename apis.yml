- aid: gingr:gingr-upload-api
  name: Gingr Upload API
  description: >-
    The **Upload** group provides endpoints for attaching files to parent and pet records. Supported file
    types include images (profile photos) and documents (vaccination certificates, signed waivers, etc.).


    Uploaded files are stored in Gingr's file storage and associated with the relevant parent or pet record.
    File size and type restrictions apply — see individual endpoint documentation for limits.
