- aid: gingr:gingr-group-classes-api
  name: Gingr Group Classes API
  description: >-
    The **Group Classes** group manages enrollment in structured group training and activity sessions.
    Unlike individual bookings, group classes have a fixed schedule, a capacity limit, and a roster of
    enrolled animals.


    Use this group to list available class sessions, check capacity, enroll an animal, and retrieve class
    rosters. Pricing for group classes is set at the class-type level in the Config group.
  humanURL: >-
