name: Gingr
kind: company
description: Gingr is pet-care business management software for dog daycare, boarding,
  training, and grooming facilities, covering reservations, check-in/checkout,
  client and pet records, feeding and medication schedules, immunizations, report
  cards, point of sale, and payments. Gingr publishes a JSON:API-style Partner API
  (api.gingr.io, X-Api-Key header, live OpenAPI/Swagger and Postman collection at
  docs.gingr.io) covering owners (parents), pets, bookings/reservations, invoices
  and payments, immunizations, and report cards, alongside an older subdomain-scoped
  legacy reporting API used for read-only pulls of owners and reservations.
