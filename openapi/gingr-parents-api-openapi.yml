openapi: 3.2.0
info:
  title: Gingr Parents API
  description: 'Welcome to the **Gingr API** — a RESTful JSON:API-compliant interface for integrating with Gingr, the leading pet-care business management platform.


    ## Authentication


    All requests require an API key passed in the `X-Api-Key` header. Keys are scoped to a specific organization and can be generated from the Gingr admin dashboard under **Settings → Integrations → API Keys**.


    ## Subdomain Header


    Every request must also include a `subdomain` header identifying which Gingr account you are operating on. This value is the subdomain portion of your Gingr URL (e.g., `mykennel` for `mykennel.gingrapp.com`).


    ## Response Format


    The API follows the JSON:API v1.0 specification. All requests must include:


    ```

    Accept: application/vnd.api+json

    ```


    POST/PUT/PATCH requests that include a body must also include:


    ```

    Content-Type: application/vnd.api+json

    ```


    Paginated list responses include a `meta` object with `currentPage`, `lastPage`, `perPage`, and `total`, as well as a `links` object with `first`, `last`, `prev`, and `next` cursor URLs.


    ## Error Handling


    | HTTP Status | Meaning |

    |-------------|---------|

    | 200 | Success |

    | 201 | Resource created |

    | 400 | Bad request / business logic error |

    | 401 | Unauthorized — invalid or missing API key |

    | 403 | Forbidden — valid key but insufficient permissions |

    | 404 | Resource not found |

    | 422 | Validation error — see `errors` array in response |

    | 500 | Internal server error |


    Validation errors (`422`) are returned as a JSON:API `errors` array where each item contains a `title` and a `detail` describing the offending field.


    ## Rate Limiting


    API requests are subject to rate limiting. Exceeding the limit returns a `429 Too Many Requests` response. Contact Gingr support to discuss higher rate limits for high-volume integrations.'
  version: 1.9.2
tags:
- name: Parents
  description: 'The **Parents** group covers everything related to the pet owner — referred to as a **Parent** in Gingr. A Parent is the primary account holder who owns one or more animals and makes bookings.


    Use this group to:


    - **Create** new parents during the intake flow (e.g., an online booking portal).

    - **Update** parent profile data such as contact info, address, and custom fields.

    - **Search / list** parents by name, email, phone, and other filters.

    - **Manage memberships** — enroll or cancel a parent''s membership plan.

    - **Manage cards on file** — retrieve saved payment methods so you can pre-fill checkout forms.

    - **Handle agreements** — check which digital waivers a parent still needs to sign and mark them as signed.


    Important considerations:


    - `email` and `cellPhone` are unique per organization. Attempting to create a duplicate will return a `422` validation error.

    - `allowOnlineLogin` controls whether the parent can log in to the Gingr consumer portal. This defaults to `false` for API-created parents unless explicitly set.

    - Custom fields (configured per organization) can be passed in the `customFields` object. Field keys vary by organization — use the Config `/v1/config` endpoint or contact support to get the key names for a specific subdomain.'
paths:
  /v1/parents/{parentId}/sign-agreements/{agreementId}:
    post:
      tags:
      - Parents
      summary: Parent - Sign Agreement
      description: Records a digital signature for a specific agreement on behalf of a parent. Once signed, the agreement is marked as completed and the parent will no longer appear in unsigned agreement queries for that template. Use the Unsigned Agreements endpoint to retrieve which agreements still require a signature before a booking can proceed.
      operationId: v1ParentSignAgreement
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Request content type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: 2547
      - name: agreementId
        in: path
        description: Agreement ID (valid Agreement ID)
        required: true
        schema:
          type: integer
          format: int64
          example: 39
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required: []
              properties:
                jsonapi:
                  properties:
                    version:
                      type: string
                      example: '1.0'
                  type: object
                data:
                  properties:
                    type:
                      type: string
                      example: sign-agreements
                    attributes:
                      required:
                      - locationId
                      - parentName
                      - ipAddress
                      properties:
                        locationId:
                          description: Location ID (should be valid ID)
                          type: integer
                          example: 1
                        parentName:
                          description: Full name of parent signing the agreement (max 255 characters)
                          type: string
                          example: John Doe
                        ipAddress:
                          description: IP address of the signing party (valid IP format)
                          type: string
                          example: 21.12.12.12
                        userAgent:
                          description: Optional. Browser user agent string (max 1024 characters)
                          type: string
                          example: Mozilla/5.0
                        password:
                          description: Optional. Parent password for verification (max 255 characters)
                          type: string
                          example: welovedogs!
                        signature:
                          description: Optional. URL to signature image (max 255 characters, must be valid image URL)
                          type: string
                          example: https://example.com/signature.png
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful response with signed agreement data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: parent-agreements
                      id:
                        description: Unique resource identifier
                        type: integer
                        format: int64
                        example: 39
                      attributes:
                        properties:
                          parentId:
                            description: ID of the parent who signed the agreement
                            type: integer
                            format: int64
                            example: 2547
                          agreementId:
                            description: ID of the agreement template that was signed
                            type: integer
                            format: int64
                            example: 39
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Successfully signed agreement.
                    type: object
                type: object
        '403':
          description: Agreement is inactive or already signed
        '404':
          description: Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 400
                  title: Bad Request
                  detail: The password associated with parent ID {$parentId} is incorrect.
      security:
      - XApiKey: []
  /v1/parents/{parentId}/unsigned-agreements:
    get:
      tags:
      - Parents
      summary: Parent - Unsigned Agreements
      description: Returns a list of agreement templates that a specific parent has not yet signed. Use this before prompting a parent to sign outstanding agreements — for example, during the online booking flow or at check-in. Each result includes the agreement template ID, name, and content needed to display and collect the signature.
      operationId: v1ParentUnsignedAgreements
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: parentId
        required: true
        schema:
          type: integer
          format: int64
          example: 2544
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: agreement-templates
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '23'
                        attributes:
                          properties:
                            title:
                              description: Display title of the agreement template
                              type: string
                              example: Agreement 23
                            body:
                              description: HTML body content of the agreement to be presented to the parent for signing
                              type: string
                              example: <p>Please sign again ...again....again</p>
                            active:
                              description: Whether the agreement template is currently active
                              type: boolean
                              example: true
                            createdById:
                              description: ID of the staff member who created the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            editedById:
                              description: ID of the staff member who last edited the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            requiredBookingTypes:
                              description: Booking types that require this agreement to be signed before booking
                              type: array
                              items:
                                properties:
                                  id:
                                    description: Booking type ID
                                    type: integer
                                    format: int64
                                    example: '100'
                                  name:
                                    description: Booking type name
                                    type: string
                                    example: Full Day Daycare
                                type: object
                          type: object
                      type: object
                type: object
        '404':
          description: Pet Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/parents/{parentId}/signed-agreements:
    get:
      tags:
      - Parents
      summary: Parent - Signed Agreements
      description: Returns a list of agreement templates that a specific parent has already signed. Each record includes the template title, body content, active status, created/edited by user IDs, and the booking types that require the agreement. Use this for compliance audits, displaying signing history in a parent portal, or verifying that required waivers are on file before a service.
      operationId: v1ParentSignedAgreements
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: 2544
      responses:
        '200':
          description: Successful response with signed agreements data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: agreement-templates
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '23'
                        attributes:
                          properties:
                            title:
                              description: Display title of the agreement template
                              type: string
                              example: Agreement 23
                            body:
                              description: HTML body content of the signed agreement
                              type: string
                              example: <p>Please sign again ...again....again</p>
                            active:
                              description: Whether the agreement template is currently active
                              type: boolean
                              example: true
                            createdById:
                              description: ID of the staff member who created the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            editedById:
                              description: ID of the staff member who last edited the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            requiredBookingTypes:
                              description: Booking types that require this agreement to be signed before booking
                              type: array
                              items:
                                properties:
                                  id:
                                    description: Booking type ID
                                    type: integer
                                    format: int64
                                    example: '100'
                                  name:
                                    description: Booking type name
                                    type: string
                                    example: Full Day Daycare
                                type: object
                          type: object
                      type: object
                type: object
        '404':
          description: Pet Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/parents/open-balance:
    get:
      tags:
      - Parents
      summary: Parent - Open Balance
      description: Retrieve open balance information for parents by location
      operationId: ParentOpenBalance
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters
        required: true
        schema:
          required:
          - locationIds
          - parentIds
          properties:
            locationIds:
              description: Location IDs (valid location IDs)
              type: array
              items:
                type: integer
              example:
              - 18
              - 3
            parentIds:
              description: Parent IDs (valid parent IDs)
              type: array
              items:
                type: integer
              example:
              - 246
          type: object
      responses:
        '200':
          description: Successful response with parent open balance data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          type: string
                          example: open-balance
                        id:
                          type: integer
                          format: int64
                          example: 246
                        attributes:
                          properties:
                            parentId:
                              type: integer
                              format: int64
                              example: 246
                            parentName:
                              type: string
                              example: Jane Doe
                            parentOpenBalance:
                              type: number
                              format: float
                              example: 50
                            homeLocationId:
                              type: integer
                              format: int64
                              example: 18
                            openInvoiceIds:
                              type: array
                              items:
                                type: integer
                              example:
                              - 101
                              - 102
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/parents/{parentId}/card-on-file:
    get:
      tags:
      - Parents
      summary: Card On File - Show
      description: Retrieves the parent’s card-on-file details, including cards stored via CardConnect and Gingr Payments.
      operationId: CardOnFileShow
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2547'
      responses:
        '200':
          description: Successful response with card on file data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        type: string
                        example: parents
                      id:
                        type: integer
                        format: int64
                        example: '2547'
                      attributes:
                        properties:
                          cardconnect:
                            properties:
                              cardId:
                                type: string
                                example: ''
                              brand:
                                type: string
                                example: Visa
                              lastFourDigits:
                                type: string
                                example: '1001'
                              expMonth:
                                type: integer
                                format: int64
                                example: '12'
                              expYear:
                                type: integer
                                format: int64
                                example: '2033'
                              postalCode:
                                type: string
                                example: '12345'
                              isPrimary:
                                type: boolean
                                example: true
                            type:
                            - object
                            - 'null'
                          gingrpayments:
                            type:
                            - array
                            - 'null'
                            items:
                              properties:
                                cardId:
                                  type: string
                                  example: pm_1TE5nVKiL2CDooP8NbphmGja
                                brand:
                                  type: string
                                  example: visa
                                lastFourDigits:
                                  type: string
                                  example: '4242'
                                expMonth:
                                  type: integer
                                  format: int64
                                  example: '1'
                                expYear:
                                  type: integer
                                  format: int64
                                  example: '2050'
                                postalCode:
                                  type: string
                                  example: ''
                                isPrimary:
                                  type: boolean
                                  example: false
                              type: object
                        type: object
                    type: object
                type: object
        '404':
          description: Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
    post:
      tags:
      - Parents
      summary: Card On File - Add
      description: Add a card on file for a parent. Supports both CardConnect and Gingr Payments processors. Duplicate cards are rejected for both processors.
      operationId: CardOnFileAdd
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2547'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required:
              - data
              properties:
                data:
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      example: card-on-file
                    attributes:
                      required:
                      - paymentProcessor
                      properties:
                        paymentProcessor:
                          description: 'Payment processor (allowed: cardconnect, gingrpayments)'
                          type: string
                          example: gingrpayments
                        cardId:
                          description: Stripe payment method ID (required for gingrpayments, prohibited for cardconnect, max 50 characters, must start with card_ or pm_)
                          type: string
                          example: pm_1TE5nVKiL2CDooP8NbphmGja
                        token:
                          description: Tokenized card number from CardSecure (required for cardconnect, prohibited for gingrpayments, max 255 characters)
                          type: string
                          example: '9418594164541111'
                        expiry:
                          description: Card expiry in MMYYYY format, e.g., 012026 for Jan 2026 (required for cardconnect, prohibited for gingrpayments, must be current or future month)
                          type: string
                          example: '012026'
                        postalCode:
                          description: Billing postal code (required for cardconnect, prohibited for gingrpayments, 5-10 characters)
                          type: string
                          example: '12345'
                        cvv:
                          description: Card CVV (required for cardconnect, prohibited for gingrpayments, 3 or 4 digits)
                          type: string
                          example: '123'
                        isPrimary:
                          description: Optional. Set as primary card (gingrpayments only, prohibited for cardconnect)
                          type: boolean
                          example: true
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful response - card added
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        type: string
                        example: parents
                      id:
                        type: string
                        example: '2574'
                      attributes:
                        properties:
                          brand:
                            type: string
                            example: Visa
                          lastFourDigits:
                            type: string
                            example: '4242'
                          expMonth:
                            type: integer
                            example: 12
                          expYear:
                            type: integer
                            example: 2029
                          postalCode:
                            type:
                            - string
                            - 'null'
                            example: '12345'
                          isPrimary:
                            type: boolean
                            example: true
                          processor:
                            description: Payment processor used (gingrpayments or cardconnect)
                            type: string
                            example: gingrpayments
                          cardId:
                            description: Stripe payment method ID (null for cardconnect)
                            type:
                            - string
                            - 'null'
                            example: pm_1TE5nVKiL2CDooP8NbphmGja
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
                        type: string
                        example: Card added successfully
                    type: object
                type: object
        '404':
          description: Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
    delete:
      tags:
      - Parents
      summary: Card On File - Delete
      description: Delete a card on file for a parent. Supports both CardConnect and Gingr Payments processors.
      operationId: CardOnFileDelete
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2547'
      - name: filter[paymentProcessor]
        in: query
        description: 'Payment processor (allowed: cardconnect, gingrpayments)'
        required: true
        schema:
          type: string
          enum:
          - cardconnect
          - gingrpayments
          example: gingrpayments
      - name: filter[cardId]
        in: query
        description: Card or payment method ID (required for gingrpayments, prohibited for cardconnect, max 50 characters, must start with card_ or pm_)
        required: false
        schema:
          type: string
          maxLength: 50
          example: pm_1TE5nVKiL2CDooP8NbphmGja
      responses:
        '200':
          description: Successful response - card deleted
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type:
                    - object
                    - 'null'
                    example: null
                  message:
                    type: string
                    example: Card deleted successfully
                type: object
        '404':
          description: Parent not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/parents/{parentId}/card-on-file/{cardId}:
    put:
      tags:
      - Parents
      summary: Card On File - Update
      description: Make a specific card the primary payment method for the parent
      operationId: cardOnFileUpdate
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: parentId
        in: path
        description: Parent ID (valid Parent ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2547'
      - name: cardId
        in: path
        description: Card ID (valid Stripe card or payment method ID, max 50 characters)
        required: true
        schema:
          type: string
          maxLength: 50
          example: pm_1TE5nVKiL2CDooP8NbphmGja
      responses:
        '200':
          description: Successful response - card made primary
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type:
                    - object
                    - 'null'
                    example: null
                  message:
                    type: string
                    example: Card has been made primary
                type: object
        '404':
          description: Parent not found, processor customer not found, or card not updated
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 400
                  title: Bad Request
                  detail: Card is already the primary card
      security:
      - XApiKey: []
  /v1/parents/{parentId}/parent-notes:
    post:
      tags:
      - Parents
      summary: Parent Employee Notes - Create
