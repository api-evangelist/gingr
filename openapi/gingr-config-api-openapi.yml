  /v1/config/hours/recurring:
    get:
      tags:
      - Config
      summary: Hours Recurring - List
      description: Returns the recurring weekly business hours configured for each location. Each record specifies the day of week and open/close times. Use this to display business hours to pet owners and to validate that a requested booking time falls within operating hours. Filter by locationId to scope results to a specific location.
      operationId: v1ConfigHoursRecurring
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters
        required: true
        schema:
          required:
          - locationId
          properties:
            locationId:
              description: Location ID to filter recurring hours (required)
              type: integer
              format: int64
              example: 1
            bookingTypeIds:
              description: Optional. Filter by booking type IDs to get type-specific hours
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
              example:
              - 23
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            number:
              description: Page number (1-based)
              type: integer
              example: 1
            size:
              description: Number of items per page
              type: integer
              enum:
              - 10
              - 25
              - 50
              - 100
              example: 10
          type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      currentPage:
                        type: integer
                        example: 1
                      lastPage:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 5
                    type: object
                  links:
                    properties:
                      first:
                        type: string
                        example: http://localhost/v1/config/hours/recurring?page[number]=1&page[size]=10
                      last:
                        type: string
                        example: http://localhost/v1/config/hours/recurring?page[number]=1&page[size]=10
                      prev:
                        type: string
                        example: ''
                      next:
                        type: string
                        example: ''
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: hours-of-operation
                        id:
                          description: Unique resource identifier
                          type: integer
                          example: 97
                        attributes:
                          properties:
                            weekDay:
                              description: Day of the week these hours apply to
                              type: string
                              example: Monday
                            hourType:
                              description: Indicates whether this applies to drop-off, pick-up, or both (Start, End, Both)
                              type: string
                              example: Start
                            open:
                              description: Opening time in HHMM 24-hour format (e.g., 600 = 6:00 AM)
                              type: integer
                              example: 600
                            close:
                              description: Closing time in HHMM 24-hour format (e.g., 1000 = 10:00 AM)
                              type: integer
                              example: 1000
                            bookingTypeId:
                              description: ID of the booking type these hours apply to (null for general hours)
                              type: integer
                              example: 23
                            bookingType:
                              description: Display name of the booking type
                              type:
                              - string
                              - 'null'
                              example: Boarding | Cats
                          type: object
                      type: object
                type: object
