    post:
      tags:
      - Config
      summary: Promotion Types - Create
      description: Creates a new promotion type for the organization. Promotion types define discount rules that can be applied to invoices — for example, a percentage discount, a flat-rate reduction, or a first-visit offer. Once created, the promotion type becomes available to assign to bookings or packages.
      operationId: v1ConfigPromotionTypesStore
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required: []
              properties:
                jsonapi:
                  properties:
                    version:
                      type: string
                      example: 1.0.0
                  type: object
                data:
                  properties:
                    type:
                      type: string
                      example: promotion-types
                    attributes:
                      required:
                      - locationIds
                      - code
                      - discountType
                      - description
                      - start
                      properties:
                        locationIds:
                          description: Location IDs where promotion is valid (1-500 items, each ID must be valid location ID)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 1
                          - 2
                          - 3
                        active:
                          description: Optional. Whether promotion is active
                          type: boolean
                          example: true
                        allowOnParentPortal:
                          description: Optional. Allow promotion on parent portal
                          type: boolean
                          example: true
                        code:
                          description: Promotion code (3-25 characters, must be unique)
                          type: string
                          example: RATHISHPROMO13
                        discountType:
                          description: 'Discount type (allowed: amount, percent)'
                          type: string
                          example: amount
                        amount:
                          description: Optional. Discount amount (must be greater than 0, required if discountType is amount)
                          type: number
                          format: float
                          example: 12
                        percent:
                          description: Optional. Discount percentage (must be greater than 0 and less than or equal to 100, required if discountType is percent)
                          type: number
                          format: float
                          example: 12
                        description:
                          description: Promotion description (max 255 characters)
                          type: string
                          example: Friends & Family Discount
                        start:
                          description: Start date and time
                          required:
                          - date
                          properties:
                            date:
                              description: Required. Start date (YYYY-MM-DD format)
                              type: string
                              example: '2025-01-01'
                            time:
                              description: Optional. Start time (HH:MM:SS format)
                              type: string
                              example: 00:00:00
                          type: object
                        end:
                          description: Optional. End date and time
                          properties:
                            date:
                              description: Optional. End date (YYYY-MM-DD format, must be after or equal to start date)
                              type: string
                              example: '2025-11-30'
                            time:
                              description: Optional. End time (HH:MM:SS format)
                              type: string
                              example: '23:59:59'
                          type: object
                        singleUse:
                          description: Optional. Whether promotion can only be used once per customer
                          type: boolean
                          example: true
                        bookingTypeIds:
                          description: Optional. Booking type IDs (1-1000 items, each ID must be valid booking type ID for selected locations)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 52
                        serviceOptionTypeIds:
                          description: Optional. Service option type IDs (1-1000 items, each ID must be valid service option type ID for selected locations)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 7
                        retailTypeIds:
                          description: Optional. Retail type IDs (1-1000 items, each ID must be valid retail type ID for selected locations)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 92
                        packageTypeIds:
                          description: Optional. Package type IDs (1-1000 items, each ID must be valid package type ID for selected locations)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 84
                        openItemTypeIds:
                          description: Optional. Open item type IDs (1-1000 items, each ID must be valid open item type ID for selected locations)
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 1
                      type: object
                  type: object
              type: object
