openapi: 3.2.0
info:
  title: Gingr Config API
  description: 'Welcome to the **Gingr API** — a RESTful JSON:API-compliant interface for integrating with Gingr, the leading pet-care business management platform.


    ## Authentication


    All requests require an API key passed in the `X-Api-Key` header. Keys are scoped to a specific organization and can be generated from the Gingr admin dashboard under **Settings → Integrations → API Keys**.


    ## Subdomain Header


    Every request must also include a `subdomain` header identifying which Gingr account you are operating on. This value is the subdomain portion of your Gingr URL (e.g., `mykennel` for `mykennel.gingrapp.com`).


    ## Response Format


    The API follows the JSON:API v1.0 specification. All requests must include:


    ```

    Accept: application/vnd.api+json

    ```


    POST/PUT/PATCH requests that include a body must also include:


    ```

    Content-Type: application/vnd.api+json

    ```


    Paginated list responses include a `meta` object with `currentPage`, `lastPage`, `perPage`, and `total`, as well as a `links` object with `first`, `last`, `prev`, and `next` cursor URLs.


    ## Error Handling


    | HTTP Status | Meaning |

    |-------------|---------|

    | 200 | Success |

    | 201 | Resource created |

    | 400 | Bad request / business logic error |

    | 401 | Unauthorized — invalid or missing API key |

    | 403 | Forbidden — valid key but insufficient permissions |

    | 404 | Resource not found |

    | 422 | Validation error — see `errors` array in response |

    | 500 | Internal server error |


    Validation errors (`422`) are returned as a JSON:API `errors` array where each item contains a `title` and a `detail` describing the offending field.


    ## Rate Limiting


    API requests are subject to rate limiting. Exceeding the limit returns a `429 Too Many Requests` response. Contact Gingr support to discuss higher rate limits for high-volume integrations.'
  version: 1.9.2
tags:
- name: Config
  description: 'The **Config** group exposes read and write endpoints for all organization-level configuration data in Gingr. This includes the lookup tables and settings that everything else depends on — species, breeds, booking types, service options, feeding options, immunization types, forms, locations, hours of operation, tax rates, areas, disabled dates, and more.


    Typically you will call these endpoints once at startup (or on a periodic refresh) to build local caches that your integration can reference when creating bookings, parents, and pets. Most config data changes infrequently and is safe to cache for hours or even days.


    Key things to know:


    - **Booking Types** define the kinds of services a location offers (e.g., Boarding, Daycare, Grooming). A booking must reference a valid booking type for the target location.

    - **Service Options** are add-ons that can be attached to a booking (e.g., extra walks, nail trim). Each service option belongs to a booking type.

    - **Forms** are questionnaires associated with bookings or animals. Form answers are collected during the pre-check process.

    - **Areas / Runs** represent physical kennel spaces. Lodging availability and capacity constraints live here.

    - **Tax Rates** define the tax rules applied when invoicing. Whether tax is applied to a booking depends on organization settings.

    - **Disabled Dates** let you know when a location is closed so you can avoid booking on those days.'
paths:
  /v1/config/account-codes:
    get:
      tags:
      - Config
      summary: Account Codes - List
      description: Returns the list of accounting codes configured for the organization. Account codes are used to categorize financial transactions for bookkeeping and reporting purposes. Each booking type and service may be associated with an account code to facilitate accounting system integrations.
      operationId: v1ConfigAccountCodes
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters
        required: false
        schema:
          properties:
            accountCodeType:
              description: Optional. Filter by account code type (minimum 3 characters)
              type: string
              example: revenue
            accountCodeParentId:
              description: Optional. Filter by account code parent ID (must match a value in the parent_id column of account_codes table)
              type: integer
              format: int64
              example: '22'
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            size:
              description: 'Optional. Number of items per page. Allowed values: 10, 25, 50, 100'
              type: integer
              enum:
              - 10
              - 25
              - 50
              - 100
              example: 10
            number:
              description: 'Optional. Page number (minimum: 1, maximum: 999999999999999999)'
              type: integer
              maximum: 999999999999999999
              minimum: 1
              example: 1
          type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      currentPage:
                        description: Current page number in the paginated result set
                        type: integer
                        format: int64
                        example: '1'
                      lastPage:
                        description: Last available page number
                        type: integer
                        format: int64
                        example: '1'
                      perPage:
                        description: Number of records returned per page
                        type: integer
                        format: int64
                        example: '10'
                      total:
                        description: Total number of account code records matching the filters
                        type: integer
                        format: int64
                        example: '2'
                    type: object
                  links:
                    properties:
                      first:
                        description: URL to the first page of results
                        type: string
                        example: http://localhost/v1/config/account-codes?page[number]=1&page[size]=10
                      last:
                        description: URL to the last page of results
                        type: string
                        example: http://localhost/v1/config/account-codes?page[number]=1&page[size]=10
                      prev:
                        description: URL to the previous page of results, empty if on first page
                        type: string
                        example: ''
                      next:
                        description: URL to the next page of results, empty if on last page
                        type: string
                        example: ''
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: account-codes
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '23'
                        attributes:
                          properties:
                            accountCodeType:
                              description: Category label for the account code used in financial reporting
                              type: string
                              example: test1
                            accountCodeParentId:
                              description: ID of the parent account code, used for hierarchical grouping
                              type: integer
                              format: int64
                              example: '22'
                            active:
                              description: Whether the account code is currently active and available for use
                              type: boolean
                              example: true
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/config/agreement-templates:
    get:
      tags:
      - Config
      summary: Agreement Templates - List
      description: Returns a paginated list of agreement templates configured for the organization. Agreement templates define the content of waivers, liability releases, and policies that parents must sign. At least one filter parameter is required. Use the template ID when calling the sign-agreement endpoint to record a parent's acceptance.
      operationId: v1configAgreementTemplatesList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters (at least one filter property is required)
        required: true
        schema:
          properties:
            title:
              description: 'Optional. Filter by agreement template title (min: 2, max: 255 characters, partial match)'
              type: string
              example: Agreement
            active:
              description: Optional. Filter by active status
              type: boolean
              example: true
            requiredBookingTypeIds:
              description: Optional. Filter by booking type IDs that require the agreement
              type: array
              items:
                type: integer
                format: int64
              example:
              - 1
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            number:
              description: 'Optional. Page number (minimum: 1)'
              type: integer
              format: int64
              example: '1'
            size:
              description: 'Optional. Number of items per page. Allowed values: 10, 25, 50, 100'
              type: integer
              format: int64
              example: '10'
          type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      currentPage:
                        description: Current page number in the paginated result set
                        type: integer
                        format: int64
                        example: '1'
                      lastPage:
                        description: Last available page number
                        type: integer
                        format: int64
                        example: '1'
                      perPage:
                        description: Number of records returned per page
                        type: integer
                        format: int64
                        example: '10'
                      total:
                        description: Total number of agreement templates matching the filters
                        type: integer
                        format: int64
                        example: '1'
                    type: object
                  links:
                    properties:
                      first:
                        description: URL to the first page of results
                        type: string
                        example: http://localhost/v1/config/agreement-templates?page[number]=1&page[size]=10
                      last:
                        description: URL to the last page of results
                        type: string
                        example: http://localhost/v1/config/agreement-templates?page[number]=1&page[size]=10
                      prev:
                        description: URL to the previous page of results, empty if on first page
                        type: string
                        example: ''
                      next:
                        description: URL to the next page of results, empty if on last page
                        type: string
                        example: ''
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: agreement-templates
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '1'
                        attributes:
                          properties:
                            title:
                              description: Display title of the agreement template
                              type: string
                              example: Sample Agreement Templates
                            body:
                              description: HTML body content of the agreement to be presented for signing
                              type: string
                              example: <p>Enter the body text of the agreement. Do not copy and paste from Word or similar app..</p>
                            active:
                              description: Whether the agreement template is currently active
                              type: boolean
                              example: true
                            createdById:
                              description: ID of the staff member who created the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            editedById:
                              description: ID of the staff member who last edited the agreement template
                              type: integer
                              format: int64
                              example: '1'
                            requiredBookingTypes:
                              description: Booking types that require this agreement to be signed before booking
                              type: array
                              items:
                                properties:
                                  id:
                                    description: Booking type ID
                                    type: integer
                                    format: int64
                                    example: '1'
                                  name:
                                    description: Booking type name
                                    type: string
                                    example: Daycare | weekday
                                type: object
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/config/areas:
    get:
      tags:
      - Config
      summary: Areas - List
      description: Retrieve a paginated list of lodging areas filtered by location. Returns area details including name, description, and associated location information with support for pagination and filtering.
      operationId: getAreasList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters for areas
        required: true
        schema:
          required:
          - locationId
          properties:
            locationId:
              description: Required. Filter by location ID (should be valid location ID)
              type: integer
              example: 1
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            number:
              description: 'Page number (min: 1, max: 999999999999999999)'
              type: integer
              maximum: 999999999999999999
              minimum: 1
              example: 1
            size:
              description: Number of items per page
              type: integer
              enum:
              - 10
              - 25
              - 50
              - 100
              example: 25
          type: object
      responses:
        '200':
          description: Successful response with lodging areas data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      currentPage:
                        description: Current page number in the paginated result set
                        type: integer
                        format: int64
                        example: '1'
                      lastPage:
                        description: Last available page number
                        type: integer
                        format: int64
                        example: '1'
                      perPage:
                        description: Number of records returned per page
                        type: integer
                        format: int64
                        example: '10'
                      total:
                        description: Total number of lodging areas matching the filters
                        type: integer
                        format: int64
                        example: '4'
                    type: object
                  links:
                    properties:
                      first:
                        description: URL to the first page of results
                        type: string
                        example: http://localhost/v1/config/areas?page[number]=1&page[size]=10
                      last:
                        description: URL to the last page of results
                        type: string
                        example: http://localhost/v1/config/areas?page[number]=1&page[size]=10
                      prev:
                        description: URL to the previous page of results, empty if on first page
                        type: string
                        example: ''
                      next:
                        description: URL to the next page of results, empty if on last page
                        type: string
                        example: ''
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: areas
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '1'
                        attributes:
                          properties:
                            name:
                              description: Display name of the lodging area
                              type: string
                              example: Standard Rooms
                            description:
                              description: Optional description of the lodging area
                              type: string
                              example: ''
                            locationId:
                              description: ID of the location this lodging area belongs to
                              type: integer
                              format: int64
                              example: '1'
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
    post:
      tags:
      - Config
      summary: Areas - Create
      description: Create a new lodging area within a specific location. The area name must be unique and the location must be active. Returns the created area details with generated ID.
      operationId: createArea
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Accept header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              required:
              - data
              properties:
                data:
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      example: areas
                    attributes:
                      required:
                      - locationId
                      - name
                      properties:
                        locationId:
                          description: ID of the location (must be active)
                          type: integer
                          example: 1
                        name:
                          description: Name of the lodging area (must be unique)
                          type: string
                          example: Premium Suite Area
                        description:
                          description: Optional description of the lodging area
                          type:
                          - string
                          - 'null'
                          example: Luxury lodging area for premium guests
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Lodging area created successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  links:
                    properties:
                      self:
                        description: URL of the created lodging area resource
                        type: string
                        example: http://localhost/v1/config/areas
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: areas
                      id:
                        description: Unique resource identifier
                        type: integer
                        example: 45
                      attributes:
                        properties:
                          locationId:
                            description: ID of the location this lodging area belongs to
                            type: integer
                            example: 1
                          name:
                            description: Display name of the lodging area
                            type: string
                            example: Premium Suite Area
                          description:
                            description: Optional description of the lodging area
                            type:
                            - string
                            - 'null'
                            example: Luxury lodging area for premium guests
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Lodging area saved successfully.
                    type: object
                type: object
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        status:
                          description: HTTP status code of the error
                          type: string
                          example: '422'
                        source:
                          properties:
                            pointer:
                              description: JSON pointer to the field that caused the error
                              type: string
                              example: /data/attributes/locationId
                          type: object
                        detail:
                          description: Human-readable explanation of the validation error
                          type: string
                          example: The locationId field is required.
                      type: object
                type: object
        '500':
          description: Internal server error
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        status:
                          description: HTTP status code of the error
                          type: string
                          example: '500'
                        detail:
                          description: Human-readable explanation of the server error
                          type: string
                          example: Failed to save lodging area.
                      type: object
                type: object
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 400
                  title: Bad Request
                  detail: Failed to save lodging area.
      security:
      - XApiKey: []
  /v1/config/belonging-areas:
    get:
      tags:
      - Config
      summary: Belonging Areas - List
      description: Returns a paginated list of belonging areas configured for the organization. Belonging areas represent physical storage locations — such as cubbies, hooks, or shelving units — where a pet's personal belongings (leashes, food, medication, etc.) are stored during their stay. Use the optional locationId filter to scope results to a specific facility. The returned area IDs can be associated with a pet's booking to track where their items are kept.
      operationId: getBelongingAreasList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters for belonging areas
        required: false
        schema:
          properties:
            locationId:
              description: Optional. Filter by location ID (must be valid existing location ID)
              type: integer
              example: 1
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            number:
              description: 'Page number (min: 1, max: 999999999999999999)'
              type: integer
              maximum: 999999999999999999
              minimum: 1
              example: 1
            size:
              description: Number of items per page
              type: integer
              enum:
              - 10
              - 25
              - 50
              - 100
              example: 25
          type: object
      responses:
        '200':
          description: Successful response with belonging areas data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: belonging-areas
                        id:
                          description: Unique resource identifier
                          type: string
                          example: '101'
                        attributes:
                          properties:
                            locationId:
                              description: ID of the location this belonging area belongs to
                              type: integer
                              example: 1
                            areaName:
                              description: Display name of the belonging storage area
                              type: string
                              example: Front Desk Cubbies
                            active:
                              description: Whether the belonging area is active
                              type: boolean
                              example: true
                          type: object
                      type: object
                  meta:
                    properties:
                      currentPage:
                        description: Current page number in the paginated result set
                        type: integer
                        example: 1
                      lastPage:
                        description: Last available page number
                        type: integer
                        example: 1
                      perPage:
                        description: Number of records returned per page
                        type: integer
                        example: 100
                      total:
                        description: Total number of belonging areas matching the filters
                        type: integer
                        example: 0
                    type: object
                  links:
                    properties:
                      first:
                        description: URL to the first page of results
                        type: string
                        example: http://localhost/v1/config/belonging-areas?page[number]=1&page[size]=100
                      last:
                        description: URL to the last page of results
                        type: string
                        example: http://localhost/v1/config/belonging-areas?page[number]=1&page[size]=100
                      prev:
                        description: URL to the previous page of results, null if on first page
                        type:
                        - string
                        - 'null'
                        example: ''
                      next:
                        description: URL to the next page of results, null if on last page
                        type:
                        - string
                        - 'null'
                        example: ''
                    type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
