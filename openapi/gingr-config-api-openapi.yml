                      type: object
                type: object
      security:
      - XApiKey: []
  /v1/config/booking-categories:
    get:
      tags:
      - Config
      summary: Booking Category - List
      description: Returns a list of all active booking categories with their basic information
      operationId: listBookingCategories
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: demo-clinic
      - name: Accept
        in: header
        description: Content type for JSON:API format
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      responses:
        '200':
          description: Successfully retrieved booking categories list
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    description: Array of booking category resources
                    type: array
                    items:
                      properties:
                        type:
                          description: Resource type identifier
                          type: string
                          example: booking-categories
                        id:
                          description: Unique booking category identifier
                          type: integer
                          example: 1
                        attributes:
                          properties:
                            name:
                              description: Booking category name
                              type: string
                              example: Boarding
                          type: object
                      type: object
