                        byParent:
                          description: Optional. When true, merges submitted field names into the precheck_reservations tracking columns (owner_info, animal_info, reservation_info, checkin_questions) and marks is_completed=1. When false (explicitly passed), removes submitted field names from those tracking columns and resets is_completed=0 with sms_sent_at updated. Omitting this param uses the legacy completion path.
                          type:
                          - boolean
                          - 'null'
                          example: true
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Precheck submitted successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
