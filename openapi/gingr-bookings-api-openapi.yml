                                  description: Payment method used for the refund
                                  type: string
                                  example: Credit Card
                                transactionTime:
                                  description: ISO 8601 format
                                  type: string
                                  example: '2024-01-20T14:30:00Z'
                                description:
                                  description: Description of the refund transaction
                                  type: string
                                  example: Refund
