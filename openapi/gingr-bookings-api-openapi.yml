                                      type: array
                                      items:
                                        type: string
                                        example: SAVE10
                                  type: object
                            type: object
                        lodgingAssignments:
                          description: Optional. Lodging assignments per date (one per day of the reservation, required if booking type has lodgings)
                          type: array
                          items:
                            required:
                            - date
                            properties:
                              date:
                                description: Date for the lodging assignment (YYYY-MM-DD format, must be within booking date range, no duplicates)
