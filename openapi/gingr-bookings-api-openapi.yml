                                  description: Feeding food type ID (valid ID)
                                  type:
                                  - integer
                                  - 'null'
                                  example: 1
                                feeding_notes:
                                  description: General feeding notes for this pet
                                  type:
                                  - string
                                  - 'null'
                                  example: No dry food
                              type:
                              - object
                              - 'null'
                            medication_schedule:
                              description: Pet medication schedule. Saved to animal_medication_schedules and reflected in animal_info. Unique per (animal, schedule_id, type_id).
                              properties:
                                schedules:
                                  description: Required. One entry per medication.
                                  type: array
                                  items:
                                    required:
                                    - schedule_id
