                              description: URL to the pet's profile image
                              type: string
                              example: https://site.com/pet.png
                            custom_animal_icons:
                              description: Color label icons to assign to the pet.
                              type:
                              - array
                              - 'null'
                              items:
                                properties:
                                  template_id:
                                    description: ID of the custom icon template to assign to the pet
                                    type: integer
                                    example: 3
                                  comments:
                                    description: Optional note to attach to the icon
