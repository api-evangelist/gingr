                            type: string
                            example: '2026-03-02'
                          to:
                            description: End date of the cancelled date range (YYYY-MM-DD format)
                            type: string
                            example: '2026-03-02'
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
