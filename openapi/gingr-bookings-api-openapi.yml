                              image:
                                description: Valid URL
                                type:
                                - string
                                - 'null'
                                example: https://example.com/toy.jpg
                            type: object
                        bookingUpdates:
                          description: Optional. Updates to apply to the booking itself. endDate, pickUpTime and deposit are not allowed when byParent=true.
                          properties:
                            endDate:
