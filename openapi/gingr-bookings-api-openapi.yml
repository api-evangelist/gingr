  /v1/bookings/{bookingId}/belongings:
    post:
      tags:
      - Bookings
      summary: Booking Belonging - Create
      description: Creates a new belonging record associated with a specific booking. Belongings track personal items (such as food, leashes, or toys) that a pet owner brings along during a stay. The belonging type ID is required — use the Belonging Types endpoint to retrieve valid options. Returns the created belonging with its assigned ID.
      operationId: v1CreateBookingBelonging
      parameters:
      - name: subdomain
        in: header
        description: Subdomain
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid booking ID)
        required: true
        schema:
          type: integer
          example: 123
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required: []
              properties:
                jsonapi:
                  properties:
                    version:
                      type: string
                      example: '1.0'
                  type: object
                data:
                  properties:
                    type:
                      type: string
                      example: belongings
                    attributes:
                      required:
                      - belongingAreaId
                      - belongingTypeId
                      properties:
                        belongingAreaId:
                          description: Belonging area ID (should be valid ID)
                          type: integer
                          example: 1
                        belongingTypeId:
                          description: Belonging type ID (should be valid ID)
                          type: integer
                          example: 2
                        description:
                          description: Optional. Description (max 500 characters)
                          type: string
                          example: Blue collar with silver tag
                        image:
                          description: Optional. Google Cloud Storage image URL
                          type: string
