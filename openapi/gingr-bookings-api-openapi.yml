openapi: 3.2.0
info:
  title: Gingr Bookings API
  description: 'Welcome to the **Gingr API** — a RESTful JSON:API-compliant interface for integrating with Gingr, the leading pet-care business management platform.


    ## Authentication


    All requests require an API key passed in the `X-Api-Key` header. Keys are scoped to a specific organization and can be generated from the Gingr admin dashboard under **Settings → Integrations → API Keys**.


    ## Subdomain Header


    Every request must also include a `subdomain` header identifying which Gingr account you are operating on. This value is the subdomain portion of your Gingr URL (e.g., `mykennel` for `mykennel.gingrapp.com`).


    ## Response Format


    The API follows the JSON:API v1.0 specification. All requests must include:


    ```

    Accept: application/vnd.api+json

    ```


    POST/PUT/PATCH requests that include a body must also include:


    ```

    Content-Type: application/vnd.api+json

    ```


    Paginated list responses include a `meta` object with `currentPage`, `lastPage`, `perPage`, and `total`, as well as a `links` object with `first`, `last`, `prev`, and `next` cursor URLs.


    ## Error Handling


    | HTTP Status | Meaning |

    |-------------|---------|

    | 200 | Success |

    | 201 | Resource created |

    | 400 | Bad request / business logic error |

    | 401 | Unauthorized — invalid or missing API key |

    | 403 | Forbidden — valid key but insufficient permissions |

    | 404 | Resource not found |

    | 422 | Validation error — see `errors` array in response |

    | 500 | Internal server error |


    Validation errors (`422`) are returned as a JSON:API `errors` array where each item contains a `title` and a `detail` describing the offending field.


    ## Rate Limiting


    API requests are subject to rate limiting. Exceeding the limit returns a `429 Too Many Requests` response. Contact Gingr support to discuss higher rate limits for high-volume integrations.'
  version: 1.9.2
tags:
- name: Bookings
  description: 'The **Bookings** group is the core of the Gingr API. A **Booking** (also called a Reservation internally) represents a scheduled service for one or more animals at a specific location and time.


    The typical booking lifecycle is:


    1. **Validate** — Call the validation endpoints to check availability and confirm there are no conflicts before committing.

    2. **Create** — Submit the booking with the required fields. The response includes the new booking ID.

    3. **Pre-check** — If the organization requires a pre-check, retrieve the pre-check form (`GET /v1/bookings/{id}/precheck-form`) and submit answers (`POST /v1/bookings/{id}/precheck`).

    4. **Accept / Confirm** — Some organizations require staff to manually confirm bookings. Use the accept endpoint when `manualConfirm` is enabled.

    5. **Checkout** — When the service is complete, submit payment via the checkout endpoint.

    6. **Cancel** — If needed, cancel the booking and optionally apply a cancellation fee.


    Key concepts:


    - **`manualConfirm`** — When this flag is `true` on a booking type, new bookings land in a "pending" state and must be explicitly accepted by staff before they are considered confirmed. If `false`, bookings are auto-confirmed.

    - **Overrides** — The `overrides` object in the create/update requests lets you bypass certain business rule validations (e.g., overbooking a run, scheduling outside business hours). Overrides require elevated API permissions and should be used sparingly.

    - **Services** — A booking can have one or more services attached (e.g., the base boarding service plus grooming add-ons). Services carry their own pricing and scheduling.

    - **Lodging** — For overnight boarding, the booking is assigned to a specific run/kennel. The available lodgings endpoint returns which runs are open for the requested dates.

    - **Pre-check** — A digital check-in form that collects health, feeding, and care instructions for the animal''s stay. Whether pre-check is required depends on organization settings.

    - **Standing Bookings** — Recurring bookings on a fixed schedule (e.g., every Monday for daycare). Changes to a standing booking can apply to the single instance or all future occurrences.'
paths:
  /v1/bookings/available-specialists:
    get:
      tags:
      - Bookings
      summary: Available Specialists - List
      description: Returns all specialists (staff members) available to perform a specific service at a location within a given date range. Use this to populate a specialist-selection step in a booking flow — for example, letting a client choose their preferred groomer. Filter by serviceId and locationId to match the booking type, and optionally narrow to a specific specialist. Each result includes the specialist's name and the time slots they are available.
      operationId: AvailableSpecialists
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters for specialist availability search
        required: true
        schema:
          required:
          - date
          - locationId
          - serviceId
          properties:
            date:
              properties:
                from:
                  description: Start date for availability search (YYYY-MM-DD format, must be today or later)
                  type: string
                  example: '2025-11-12'
                to:
                  description: End date for availability search (YYYY-MM-DD format, max 31 days from start date)
                  type: string
                  example: '2025-11-23'
              type: object
            locationId:
              description: Location ID (should be valid ID)
              type: integer
              format: int64
              example: '1'
            serviceId:
              description: Service ID (should be valid ID)
              type: integer
              format: int64
              example: '369'
            specialistId:
              description: Optional. Specialist ID (should be valid ID)
              type: integer
              format: int64
              example: '526'
          type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: specialists
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '526'
                        attributes:
                          properties:
                            name:
                              description: Display name of the specialist
                              type: string
                              example: Rathish specialist 2
                            userId:
                              description: ID of the staff user associated with this specialist
                              type: integer
                              format: int64
                              example: '1840'
                            serviceId:
                              description: ID of the service this specialist performs
                              type: integer
                              format: int64
                              example: '369'
                            serviceName:
                              description: Name of the service this specialist performs
                              type: string
                              example: Rathish Service 2
                            servicePrice:
                              description: Price of the service performed by this specialist
                              type: string
                              example: '22.00'
                            available:
                              description: List of availability slots for this specialist within the requested date range
                              type: array
                              items:
                                properties:
                                  based:
                                    description: Availability basis — either "time" (slot-based) or "capacity" (count-based)
                                    type: string
                                    example: time
                                  date:
                                    description: Date of availability in YYYY-MM-DD format
                                    type: string
                                    example: '2025-11-14'
                                  totalAvailable:
                                    description: Total number of appointment slots available on this date
                                    type: integer
                                    format: int64
                                    example: '24'
                                  totalRemaining:
                                    description: Number of appointment slots still available after existing bookings
                                    type: integer
                                    format: int64
                                    example: '24'
                                  schedules:
                                    description: Individual time slots available on this date
                                    type: array
                                    items:
                                      properties:
                                        time:
                                          description: Start time of the appointment slot
                                          type: string
                                          example: 10:00 AM
                                        duration:
                                          description: Duration of the appointment slot
                                          type: integer
                                          format: int64
                                          example: '60'
                                        durationUnit:
                                          description: Unit of the duration value (e.g., minutes)
                                          type: string
                                          example: minutes
                                        capacity:
                                          description: Total number of bookings this time slot can accommodate
                                          type: integer
                                          format: int64
                                          example: '1'
                                        remaining:
                                          description: Number of openings remaining in this time slot
                                          type: integer
                                          format: int64
                                          example: '1'
                                      type: object
                                type: object
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/bookings/next-available-specialists:
    get:
      tags:
      - Bookings
      summary: Available Specialists - List Next
      description: Returns the next available date and time slot for a given service and location, optionally scoped to a specific specialist. Use this to suggest the earliest open appointment when building a booking flow. The search starts from the provided date and looks up to 3 months ahead. Returns 400 if no availability is found within that window.
      operationId: nextAvailableSpecialists
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters for next available specialist search
        required: true
        schema:
          required:
          - date
          - locationId
          - serviceId
          properties:
            date:
              description: Search date (YYYY-MM-DD format, must be today or later, max 1 year ahead)
              type: string
              example: '2025-11-14'
            locationId:
              description: Location ID (must be valid location ID)
              type: integer
              format: int64
              example: '1'
            serviceId:
              description: Service ID (must be valid service ID)
              type: integer
              format: int64
              example: '366'
            specialistId:
              description: Optional. Specialist ID (must be valid specialist ID)
              type: integer
              format: int64
              example: '519'
          type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: specialists
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '519'
                        attributes:
                          properties:
                            name:
                              description: Display name of the specialist
                              type: string
                              example: Amit Kumar
                            userId:
                              description: ID of the staff user associated with this specialist
                              type: integer
                              format: int64
                              example: '1804'
                            serviceId:
                              description: ID of the service this specialist performs
                              type: integer
                              format: int64
                              example: '366'
                            serviceName:
                              description: Name of the service this specialist performs
                              type: string
                              example: Sami Service 2
                            servicePrice:
                              description: Price of the service performed by this specialist
                              type: string
                              example: '20.00'
                            available:
                              description: Next available date and time slot details for this specialist
                              properties:
                                based:
                                  description: Availability basis — either "time" (slot-based) or "capacity" (count-based)
                                  type: string
                                  example: time
                                date:
                                  description: Next available date in YYYY-MM-DD format
                                  type: string
                                  example: '2025-11-21'
                                totalAvailable:
                                  description: Total number of appointment slots available on this date
                                  type: integer
                                  format: int64
                                  example: '14'
                                totalRemaining:
                                  description: Number of appointment slots still available after existing bookings
                                  type: integer
                                  format: int64
                                  example: '12'
                                schedules:
                                  description: Individual time slots available on this date
                                  type: array
                                  items:
                                    properties:
                                      time:
                                        description: Start time of the appointment slot
                                        type: string
                                        example: 10:00 AM
                                      duration:
                                        description: Duration of the appointment slot
                                        type: integer
                                        format: int64
                                        example: '60'
                                      durationUnit:
                                        description: Unit of the duration value (e.g., minutes)
                                        type: string
                                        example: minutes
                                      capacity:
                                        description: Total number of bookings this time slot can accommodate
                                        type: integer
                                        format: int64
                                        example: '1'
                                      remaining:
                                        description: Number of openings remaining in this time slot
                                        type: integer
                                        format: int64
                                        example: '1'
                                    type: object
                              type: object
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '400':
          description: No availability found
      security:
      - XApiKey: []
  /v1/bookings/{bookingId}/feeding-administration-status:
    get:
      tags:
      - Bookings
      summary: Feeding Administration Status - List
      description: Get all feeding administration reports for a booking
      operationId: v1BookingFeedingAdministrationStatusList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid booking ID)
        required: true
        schema:
          type: integer
          example: 123
      responses:
        '200':
          description: Feeding administration reports retrieved successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: feeding-administration-status
                        id:
                          description: Unique resource identifier
                          type: integer
                          example: 1
                        attributes:
                          properties:
                            bookingId:
                              description: ID of the booking this feeding report belongs to
                              type: integer
                              example: 123
                            feedingScheduleId:
                              description: ID of the feeding schedule entry for the pet
                              type: integer
                              example: 1
                            feedingReportStatusId:
                              description: ID of the feeding report status (e.g., fed, refused, not given)
                              type:
                              - integer
                              - 'null'
                              example: 2
                            feedingTypeId:
                              description: ID of the food type given to the pet
                              type:
                              - integer
                              - 'null'
                              example: 3
                            date:
                              description: ISO 8601 date-time string of when the feeding was recorded
                              type: string
                              example: '2024-06-16T00:00:00Z'
                            notes:
                              description: Optional staff notes about the feeding
                              type:
                              - string
                              - 'null'
                              example: Fed well
                            lastEditedBy:
                              description: ID of the staff member who last updated this record
                              type:
                              - integer
                              - 'null'
                              example: 5
                            lastEditedAt:
                              description: ISO 8601 date-time string of when the record was last updated
                              type:
                              - string
                              - 'null'
                              example: '2024-06-16T01:06:40Z'
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
    put:
      tags:
      - Bookings
      summary: Feeding Administration Status - Save
      description: Create, update, or delete a feeding administration report for a booking
      operationId: v1BookingFeedingAdministrationStatusSave
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Request content type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid booking ID)
        required: true
        schema:
          type: integer
          example: 123
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required:
              - data
              properties:
                data:
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: feeding-administration-status
                    attributes:
                      required:
                      - feedingScheduleId
                      properties:
                        feedingScheduleId:
                          description: Feeding schedule ID (should be valid ID)
                          type: integer
                          example: 1
                        reportStatusId:
                          description: Optional. Feeding report status ID (should be valid ID)
                          type:
                          - integer
                          - 'null'
                          example: 2
                        notes:
                          description: Optional. Notes (max 1000 characters)
                          type:
                          - string
                          - 'null'
                          example: Fed well
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Feeding administration status saved successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: feeding-administration-status
                      id:
                        description: Unique resource identifier
                        type: string
                        example: '123'
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Feeding administration status saved successfully
                    type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 500
                  title: Internal Server Error
                  detail: Failed to save feeding administration status
      security:
      - XApiKey: []
