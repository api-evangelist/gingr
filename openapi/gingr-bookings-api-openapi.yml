                                        description: YYYY-MM-DD
                                        type: string
                                        example: '2026-06-15'
                                      end_date:
                                        description: YYYY-MM-DD, must be >= start_date
                                        type: string
                                        example: '2026-06-19'
                                      type_id:
                                        description: Medication type ID (valid ID)
                                        type:
                                        - integer
                                        - 'null'
                                        example: 11
                                      amount_id:
                                        description: Medication amount ID (valid ID)
                                        type:
                                        - integer
                                        - 'null'
                                        example: 8
                                      unit_id:
                                        description: Medication unit ID (valid ID)
                                        type:
                                        - integer
                                        - 'null'
                                        example: 1
                                      notes:
                                        description: Special instructions for this medication
                                        type:
                                        - string
                                        - 'null'
