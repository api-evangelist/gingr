                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: bookings
                      id:
                        description: Unique resource identifier
                        type: integer
                        format: int64
                        example: 31654
                      attributes:
