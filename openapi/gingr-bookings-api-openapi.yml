        '409':
          description: Booking is cancelled, already checked in, or has already ended
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '500':
          description: Internal server error — exception thrown during precheck submission
      security:
      - XApiKey: []
  /v1/bookings/{bookingId}/checkout:
    post:
      tags:
      - Bookings
      summary: Bookings - Checkout
      description: Check out a reservation — generates an invoice, applies discounts/packages/memberships/coupons, processes payment, and completes the transaction
      operationId: v1BookingCheckout
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content type of the request body
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid Booking ID, must be checked-in and not already checked out)
        required: true
        schema:
          type: integer
          example: 9810
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: bookings
                    attributes:
                      required:
                      - paymentMethodId
                      properties:
                        paymentMethodId:
                          description: Payment method ID (should be valid active payment method ID)
                          type: integer
                          example: 3
                        cardId:
                          description: Optional. Specific card ID to charge (must start with card_ or pm_ prefix, max 50 characters). Only allowed when payment method processor is gingrpayments.
                          type: string
                          example: pm_1234567890
                        openLineItems:
                          description: Optional. Open line items to add to the invoice (max 5)
                          type: array
                          items:
                            required:
                            - typeId
                            - price
                            properties:
                              typeId:
                                description: Open line item type ID (must be valid, active, and editable)
                                type: integer
                                example: 1
                              price:
                                description: Price (cannot be zero; negative only if allow_negative is enabled for the type)
                                type: number
                                example: 15
                              description:
                                description: Optional. Description (max 255 characters)
                                type: string
                                example: Extra grooming supplies
                            type: object
                        coupons:
                          description: Optional. Coupon codes to apply (max 10)
                          type: array
                          items:
                            required:
                            - type
                            - code
                            properties:
                              type:
                                description: Coupon target type
                                type: string
                                enum:
                                - booking
                                - service
                                - openLineItem
                                example: booking
                              typeId:
                                description: Optional. Target item ID — required when type is "service" (valid service ID for this booking) or "openLineItem" (must match a typeId in the openLineItems array)
                                type: integer
                                example: 5
                              code:
                                description: Coupon code (3-100 characters, must be valid for this location)
                                type: string
                                example: SAVE10
                            type: object
                        membershipPricingBenefits:
                          description: Optional. Membership pricing benefits to apply (max 10)
                          type: array
                          items:
                            required:
                            - type
                            - benefitId
                            properties:
                              type:
                                description: Benefit target type
                                type: string
                                enum:
                                - booking
                                - service
                                - openLineItem
                                example: booking
                              typeId:
                                description: Optional. Target item ID — required when type is "service" (valid service ID for this booking) or "openLineItem" (must match a typeId in the openLineItems array)
                                type: integer
                                example: 5
                              benefitId:
                                description: Membership pricing benefit ID (must be valid and applicable for this location)
                                type: integer
                                example: 12
                            type: object
                        membershipCreditBenefits:
                          description: Optional. A single membership credit benefit to apply. Provide benefitId and noOfCredits as a flat object.
                          properties:
                            benefitId:
                              description: Membership credit benefit ID (must be valid with sufficient credits)
                              type: integer
                              example: 8
                            noOfCredits:
                              description: Number of credits to use (min 1, cannot exceed booking days)
                              type: integer
                              example: 2
                          type: object
                        packageCreditBenefits:
                          description: Optional. Package credit benefits to apply (max 10)
                          type: array
                          items:
                            required:
                            - type
                            - ownerPackageId
                            - noOfCredits
                            properties:
                              type:
                                description: Package credit target type
                                type: string
                                enum:
                                - booking
                                - service
                                example: booking
                              typeId:
                                description: Optional. Required when type is "service", prohibited when type is "booking". Must be a valid service ID for this booking.
                                type: integer
                                example: 5
                              ownerPackageId:
                                description: Owner package ID (must be valid with sufficient credits)
                                type: integer
                                example: 3
                              noOfCredits:
                                description: Number of credits to use (min 1, max 100, cannot exceed booking days)
                                type: integer
                                example: 1
                            type: object
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful checkout response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: invoices
                      id:
                        description: Unique identifier of the generated invoice
                        type: integer
                        example: 12345
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Booking checked out successfully
                    type: object
                type: object
        '404':
          description: Booking not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/bookings/{bookingId}/accept:
    post:
      tags:
      - Bookings
      summary: Bookings - Accept
      description: Accept a booking. Optionally confirm it and assign lodgings in a single request. Validates immunizations for wait-listed bookings unless overridden.
      operationId: v1BookingAccept
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid Booking ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '24565'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: bookings
                    attributes:
                      required:
                      - confirm
                      properties:
                        confirm:
                          description: true = accept and confirm; false = accept only
                          type: boolean
                          example: false
                        overrides:
                          description: Optional. Validation overrides (defaults to false for all if not provided)
                          properties:
                            lodgings:
                              description: 'Optional. true = skip lodging capacity validation (default: false)'
                              type: boolean
                              example: true
                            immunizations:
                              description: 'Optional. true = skip immunization validation for wait-listed bookings (default: false). Only applicable when booking is on wait list.'
                              type: boolean
                              example: false
                          type: object
                        lodgingAssignments:
                          description: Optional. Lodging assignments for each date. Required when booking type has lodging configured. Must not be provided when booking type does not require lodging.
                          type: array
                          items:
                            properties:
                              date:
                                description: Date (YYYY-MM-DD, must fall within booking dates)
                                type: string
                                example: '2026-01-01'
                              id:
