  /v1/bookings/{bookingId}/services:
    put:
      tags:
      - Bookings
      summary: Booking Service - Add
      description: Add a service with optional addons to a booking
      operationId: v1BookingAddService
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
