              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: standing-bookings
                      id:
                        description: Unique resource identifier
                        type: integer
                        example: 208
                      attributes:
                        properties:
