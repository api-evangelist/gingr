  /v1/bookings/validate-prior-bookings:
    get:
      tags:
      - Bookings
      summary: Bookings - Validate Prior Bookings
      description: Checks whether each pet has completed the required prior reservation type before a booking can be created. Returns per-pet validation results.
      operationId: BookingsValidatePriorBookings
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter[animalIds][]
        in: query
        description: One or more pet IDs to validate (required, at least one)
        required: true
        schema:
          type: array
          items:
            type: integer
          example:
          - 42
          - 43
      - name: filter[bookingTypeId]
        in: query
        description: ID of the booking type being requested (e.g. Boarding, Daycare, Grooming)
        required: true
        schema:
          type: integer
          example: 5
      - name: filter[locationId]
        in: query
        description: Location ID
        required: true
        schema:
          type: integer
          example: 1
      - name: filter[isCustomerPortal]
        in: query
        description: Determines if the validation request originates from the customer portal or Business Portal. Affects customer-facing error messaging.
        required: true
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: All pets meet the prior booking requirement
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    description: JSON:API version information
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    description: Primary validation result resource
                    properties:
                      type:
                        description: Resource type identifier
                        type: string
                        example: prior-booking-validation
                      id:
                        description: Unique identifier for this validation result
                        type: string
                        example: prior-validation-2024-11-15-001
                      attributes:
                        description: Validation result attributes
                        properties:
                          isValid:
                            description: True if all pets meet the prior booking requirement
                            type: boolean
                            example: true
                          validatedAt:
                            description: ISO 8601 timestamp of when the validation was performed
                            type: string
                            example: '2024-11-15T10:30:00+00:00'
                          validationResults:
                            description: Detailed results for each validation check
                            properties:
                              completedBookingRequirement:
                                description: Result of the require_reservation_of_type check — applies to both BP and CP
                                properties:
                                  status:
                                    description: passed or failed
                                    type: string
                                    example: passed
                                  message:
                                    description: Human-readable failure message, null when passed
                                    type:
                                    - string
                                    - 'null'
                                    example: null
                                  requiredBookingTypeId:
                                    description: ID of the required prior booking type, null if no prerequisite configured
                                    type:
                                    - integer
                                    - 'null'
                                    example: null
                                  requiredBookingTypeName:
                                    description: Name of the required prior booking type, null if no prerequisite configured
                                    type:
                                    - string
                                    - 'null'
                                    example: null
                                type: object
                              customerPortalBookingRequirement:
                                description: CP-only check — applies when the requested booking type is a reservation (only_appointment=0) and require_previous_reservation_online preference is enabled
                                properties:
                                  status:
                                    description: passed or failed
                                    type: string
                                    example: passed
                                  message:
                                    description: Human-readable failure message, null when passed
                                    type:
                                    - string
                                    - 'null'
                                    example: null
                                  requiresPriorBooking:
                                    description: True when the CP prior booking preference is enabled and the owner has not completed any prior reservation
                                    type: boolean
                                    example: false
                                type: object
                              customerPortalAppointmentRequirement:
                                description: CP-only check — applies when the requested booking type is an appointment (only_appointment=1) and require_previous_reservation_online_appointment preference is enabled
                                properties:
                                  status:
                                    description: passed or failed
                                    type: string
                                    example: passed
                                  message:
                                    description: Human-readable failure message, null when passed
                                    type:
                                    - string
                                    - 'null'
                                    example: null
                                  requiresPriorAppointment:
                                    description: True when the CP prior appointment preference is enabled and the owner has not completed any prior reservation
                                    type: boolean
                                    example: false
                                type: object
                            type: object
                          petValidations:
                            description: Per-pet validation results for the completedBookingRequirement check
                            type: array
                            items:
                              properties:
                                petId:
                                  description: Pet ID
                                  type: integer
                                  example: 42
                                petName:
                                  description: Pet name
                                  type: string
                                  example: Buddy
                                hasRequiredPriorBooking:
                                  description: True if the pet has satisfied the prior booking requirement
                                  type: boolean
                                  example: true
                                completedRequiredBookings:
                                  description: List of completed qualifying bookings for this pet
                                  type: array
                                  items:
                                    properties:
                                      bookingId:
                                        description: Reservation ID
                                        type: integer
                                        example: 1001
                                      bookingTypeName:
                                        description: Name of the completed required booking type
                                        type: string
                                        example: Day Care Evaluation
                                      completedDate:
                                        description: ISO 8601 check-out timestamp of the completed booking
                                        type: string
                                        example: '2024-10-15T17:00:00Z'
                                    type: object
                              type: object
                        type: object
                    type: object
                  meta:
                    description: Top-level metadata for the validation request
                    properties:
                      validationId:
                        description: Unique identifier for this validation request
                        type: string
                        example: prior-validation-2024-11-15-001
                      requestedBookingType:
                        description: Name of the requested booking type
                        type: string
                        example: Boarding
                      isCustomerPortalRequest:
                        description: True if the request originated from the customer portal
                        type: boolean
                        example: true
                    type: object
                type: object
        '422':
          description: 'Validation failed — one or more of: pet missing required prior booking, customer portal prior booking/appointment required'
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - title: REQUIRED_PRIOR_BOOKING_MISSING
                        properties:
                          id:
                            type: string
                            example: prior-booking-error-001
                          status:
                            type: string
                            example: '422'
                          code:
                            type: string
                            example: REQUIRED_PRIOR_BOOKING_MISSING
                          title:
                            type: string
                            example: Prior Booking Requirement Not Met
                          detail:
                            type: string
                            example: Buddy must complete a 'Day Care Evaluation' booking before you can request a 'Boarding' booking
                          meta:
                            properties:
                              validationType:
                                type: string
                                example: completedBookingRequirement
                              petId:
                                type: integer
                                example: 42
                              petName:
                                type: string
                                example: Buddy
                              requiredBookingTypeId:
                                type: integer
                                example: 3
                              requiredBookingTypeName:
                                type: string
                                example: Day Care Evaluation
                              requestedBookingTypeId:
                                type: integer
                                example: 5
                              requestedBookingTypeName:
                                type: string
                                example: Boarding
                              canOverride:
                                type: boolean
                                example: true
                              overridePermission:
                                type: string
                                example: can_override_completed_res_type
                            type: object
                        type: object
                      - title: CUSTOMER_PORTAL_PRIOR_BOOKING_REQUIRED
                        properties:
                          id:
                            type: string
                            example: prior-booking-error-002
                          status:
                            type: string
                            example: '422'
                          code:
                            type: string
                            example: CUSTOMER_PORTAL_PRIOR_BOOKING_REQUIRED
                          title:
                            type: string
                            example: Prior Booking Required for Customer Portal
                          detail:
                            type: string
                            example: A prior booking is required before pet parent-made booking can be made. Please contact the facility to schedule your first Booking.
                          source:
                            properties:
                              parameter:
                                type: string
                                example: isCustomerPortal
                            type: object
                          meta:
                            properties:
                              validationType:
                                type: string
                                example: customerPortalBookingRequirement
                              requiresPriorBooking:
                                type: boolean
                                example: true
                              isCustomerPortalRequest:
                                type: boolean
                                example: true
                              contactRequired:
                                type: boolean
                                example: true
                            type: object
                        type: object
                      - title: CUSTOMER_PORTAL_PRIOR_APPOINTMENT_REQUIRED
                        properties:
                          id:
                            type: string
                            example: prior-booking-error-003
                          status:
                            type: string
                            example: '422'
                          code:
                            type: string
                            example: CUSTOMER_PORTAL_PRIOR_APPOINTMENT_REQUIRED
                          title:
                            type: string
                            example: Prior Appointment Required for Customer Portal
                          detail:
                            type: string
                            example: A prior appointment is required before pet parent-made appointments can be made. Please contact the facility to schedule your first appointment.
                          source:
                            properties:
                              parameter:
                                type: string
                                example: isCustomerPortal
                            type: object
                          meta:
                            properties:
                              validationType:
                                type: string
                                example: customerPortalAppointmentRequirement
                              requiresPriorAppointment:
                                type: boolean
                                example: true
                              isCustomerPortalRequest:
                                type: boolean
                                example: true
                              isAppointmentRequest:
                                type: boolean
                                example: true
                              contactRequired:
                                type: boolean
                                example: true
                            type: object
                        type: object
                type: object
        '404':
          description: Pet not found
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        id:
                          type: string
                          example: error-abc123
                        status:
                          type: string
                          example: '404'
                        code:
                          type: string
                          example: RESOURCE_NOT_FOUND
                        title:
                          type: string
                          example: Pet Not Found
                        detail:
                          type: string
                          example: Pet with ID 999 does not exist or is not accessible
                      type: object
                type: object
        '409':
          description: Selected pets belong to different owners
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        id:
                          type: string
                          example: error-abc123
                        status:
                          type: string
                          example: '409'
                        code:
                          type: string
                          example: PET_OWNER_MISMATCH
                        title:
                          type: string
                          example: Pet Ownership Conflict
                        detail:
                          type: string
                          example: The selected pets belong to different owners. Prior booking validation requires animals from the same owner.
                      type: object
                type: object
      security:
      - XApiKey: []
