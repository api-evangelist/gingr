        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: standingBookingId
        in: path
        description: Standing booking ID (should be valid ID)
        required: true
        schema:
          type: integer
          format: int64
          example: 208
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              properties:
                jsonapi:
                  properties:
                    version:
                      description: JSON:API specification version
                      type: string
                      example: '1.0'
                  type: object
                data:
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: standing-bookings
                    id:
                      description: Unique resource identifier
                      type: integer
                      example: 208
                    attributes:
                      required:
                      - from
                      - to
                      properties:
                        from:
                          description: Start date (YYYY-MM-DD format, must be today or future date)
                          type: string
                          example: '2026-03-02'
                        to:
                          description: End date (YYYY-MM-DD format, must be same or after from date, max 60 days range)
                          type: string
                          example: '2026-03-02'
                      type: object
                  type: object
              type: object
