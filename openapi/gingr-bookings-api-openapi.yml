        in: header
        description: Content-Type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: bookingId
        in: path
        description: Booking ID (valid booking ID that is not cancelled or checked out)
        required: true
        schema:
          type: integer
          format: int64
          example: '123'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: bookings
                    attributes:
                      properties:
                        serviceId:
                          description: Service ID (should be valid ID)
                          type: integer
                          example: 42
                        price:
                          description: Optional. Service price (valid amount). When omitted, the default service rate for the booking location is used.
                          type: number
                          format: float
                          example: 45
                        specialistId:
                          description: Required when the service is appointment-based (i.e., specialists exist for this service at the booking location); prohibited otherwise.
                          type: integer
                          example: 12
                        scheduledDate:
                          description: Scheduled date (YYYY-MM-DD format) - Required when service is scheduled
                          type: string
                          example: '2025-09-11'
                        scheduledTime:
                          description: Scheduled time (h:i A format, e.g., 08:30 AM) - Required for time-based scheduled services. Omit for slot-based services.
                          type: string
                          example: 08:30 AM
                        duration:
                          description: Service duration in minutes - Required for time-based scheduled services. Omit for slot-based services.
                          type: integer
                          maximum: 999
                          minimum: 1
                          example: 60
                        slots:
                          description: Number of slots for slot-based services (1-1000). When provided without scheduledTime, the service is treated as slot-based. Defaults to 1 if omitted for slot-based requests.
                          type: integer
                          maximum: 1000
                          minimum: 1
                          example: 1
                        addons:
                          description: Optional. Service addons
                          type: array
                          items:
                            properties:
                              addonId:
                                description: Addon ID (should be valid ID)
                                type: integer
                                example: 18
                              price:
                                description: 'Optional. Addon price (valid amount). When omitted, the default addon rate for the booking location is used. DEPRECATED: this field will be removed in a future release; addon price will be determined automatically.'
                                type: number
                                format: float
                                example: 15
                                deprecated: true
                            type: object
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Service added successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: booking-services
                      id:
                        description: Unique resource identifier
                        type: string
                        example: '156'
                      attributes:
                        properties:
                          serviceId:
                            description: ID of the service that was added
                            type: integer
                            format: int64
                            example: '42'
                          serviceName:
                            description: Name of the service that was added
                            type: string
                            example: Premium Grooming
                          price:
                            description: Price charged for the service
                            type: number
                            format: float
                            example: '45.00'
                          addons:
                            description: List of add-ons included with this service
                            type: array
                            items:
                              properties:
                                addonId:
                                  description: ID of the add-on
                                  type: integer
                                  format: int64
                                  example: '18'
                                addonName:
                                  description: Name of the add-on
                                  type: string
                                  example: Nail Trim
                                price:
                                  description: Price charged for the add-on
                                  type: number
                                  format: float
                                  example: '15.00'
                              type: object
                          totalPrice:
                            description: Combined total price of the service and all add-ons
                            type: number
                            format: float
                            example: '72.50'
                          slots:
                            description: Number of slots consumed (present for slot-based services)
                            type:
                            - integer
                            - 'null'
                            example: 1
                        type: object
                    type: object
                type: object
        '404':
          description: Booking not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
