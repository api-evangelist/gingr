openapi: 3.2.0
info:
  title: Gingr Pets API
  description: 'Welcome to the **Gingr API** — a RESTful JSON:API-compliant interface for integrating with Gingr, the leading pet-care business management platform.


    ## Authentication


    All requests require an API key passed in the `X-Api-Key` header. Keys are scoped to a specific organization and can be generated from the Gingr admin dashboard under **Settings → Integrations → API Keys**.


    ## Subdomain Header


    Every request must also include a `subdomain` header identifying which Gingr account you are operating on. This value is the subdomain portion of your Gingr URL (e.g., `mykennel` for `mykennel.gingrapp.com`).


    ## Response Format


    The API follows the JSON:API v1.0 specification. All requests must include:


    ```

    Accept: application/vnd.api+json

    ```


    POST/PUT/PATCH requests that include a body must also include:


    ```

    Content-Type: application/vnd.api+json

    ```


    Paginated list responses include a `meta` object with `currentPage`, `lastPage`, `perPage`, and `total`, as well as a `links` object with `first`, `last`, `prev`, and `next` cursor URLs.


    ## Error Handling


    | HTTP Status | Meaning |

    |-------------|---------|

    | 200 | Success |

    | 201 | Resource created |

    | 400 | Bad request / business logic error |

    | 401 | Unauthorized — invalid or missing API key |

    | 403 | Forbidden — valid key but insufficient permissions |

    | 404 | Resource not found |

    | 422 | Validation error — see `errors` array in response |

    | 500 | Internal server error |


    Validation errors (`422`) are returned as a JSON:API `errors` array where each item contains a `title` and a `detail` describing the offending field.


    ## Rate Limiting


    API requests are subject to rate limiting. Exceeding the limit returns a `429 Too Many Requests` response. Contact Gingr support to discuss higher rate limits for high-volume integrations.'
  version: 1.9.2
tags:
- name: Pets
  description: 'The **Pets** group manages **Animals** — the pets that belong to a Parent. In Gingr, the internal model is called `Animal` but the API surfaces it as `Pet` for clarity.


    Use this group to:


    - **List** all pets for a parent or search across the organization.

    - **Create** a new pet and associate it with an existing parent.

    - **Update** pet profile data including breed, weight, birthdate, and special notes.

    - **Manage immunizations** — attach vaccination records required before the animal can be booked.

    - **Manage medications** — record medications the animal is currently taking so staff are informed during the stay.

    - **Retrieve feeding instructions** — feeding details attached to the pet for use during overnight stays.


    Key things to know:


    - A pet must belong to a **Parent** — you cannot create a pet without a valid `parentId`.

    - **Species** and **Breed** must reference valid IDs from the Config endpoints (`/v1/species`, `/v1/breeds`).

    - **Immunization requirements** vary by organization and booking type. Check the Config immunization endpoints to know which vaccines are required for a given booking.

    - A pet can have a **temperament** flag that may affect which runs or services are available for booking.'
paths:
  /v1/pets/{petId}/immunizations:
    get:
      tags:
      - Pets
      summary: Pets Immunizations - List
      description: Retrieve list of immunizations for a specific pet with optional expiration filtering
      operationId: v1PetsImmunizationsList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Accept header for API version
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: petId
        in: path
        description: Pet ID (valid pet identifier)
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      - name: filter[isExpired]
        in: query
        description: Optional. Filter by expiration status (true/false, 1/0, "true"/"false")
        required: false
        schema:
          type: boolean
          example: false
      responses:
        '200':
          description: Successfully retrieved immunizations list
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      total:
                        description: Total number of immunization records for the pet
                        type: integer
                        format: int64
                        example: 3
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: immunizations
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: 10
                        attributes:
                          properties:
                            immunizationTypeId:
                              description: ID of the immunization type (e.g., Rabies, Bordetella)
                              type: integer
                              format: int64
                              example: 2
                            immunizationType:
                              description: Display name of the immunization type
                              type: string
                              example: Bordetella
                            expirationDate:
                              description: Date when the immunization expires (YYYY-MM-DD)
                              type: string
                              format: date
                              example: '2030-08-29'
                            immunizationNotes:
                              description: Optional notes about the immunization
                              type:
                              - string
                              - 'null'
                              example: Vaccination completed successfully
                            lastUpdateDate:
                              description: Date the immunization record was last updated (YYYY-MM-DD)
                              type: string
                              format: date
                              example: '2025-07-31'
                            lastUpdatedBy:
                              description: ID of the user who last updated this immunization record
                              type:
                              - integer
                              - 'null'
                              format: int64
                              example: 1
                          type: object
                      type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 404
                  title: Not Found
                  detail: Pet not found
      security:
      - XApiKey: []
  /v1/pets/{petId}/immunizations/{immunizationTypeId}:
    put:
      tags:
      - Pets
      summary: Pets Immunizations - Update
      description: Updates an existing immunization record for a specific pet. Use this to record a new vaccination date, update an expiration date, or correct immunization details. The immunization type ID must reference a valid record already on file for the pet. Returns 404 if the pet or immunization record does not exist. At least one of immunizationDate or immunizationNotes must be provided.
      operationId: PetsImmunizationsUpdate
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: petId
        in: path
        description: Pet ID (valid pet identifier)
        required: true
        schema:
          type: integer
          format: int64
          example: '2904'
      - name: immunizationTypeId
        in: path
        description: Immunization type ID (valid immunization type identifier)
        required: true
        schema:
          type: integer
          format: int64
          example: '9'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required: []
              properties:
                jsonapi:
                  properties:
                    version:
                      type: string
                      example: '1.0'
                  type: object
                data:
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: immunizations
                    id:
                      description: Immunization type ID to update
                      type: integer
                      format: int64
                      example: '9'
                    attributes:
                      properties:
                        immunizationDate:
                          description: Date the immunization was administered (YYYY-MM-DD); used to compute expiration. Required if immunizationNotes is not provided.
                          type: string
                          example: '2035-01-01'
                        immunizationNotes:
                          description: Notes about the immunization. Required if immunizationDate is not provided.
                          type: string
                          example: Test notes
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: immunizations
                      id:
                        description: Unique identifier of the updated immunization record
                        type: integer
                        format: int64
                        example: '9'
                      attributes:
                        properties:
                          immunizationNotes:
                            description: Notes about the immunization
                            type: string
                            example: Test notes
                          expirationDate:
                            description: Updated expiration date of the immunization (ISO 8601)
                            type: string
                            example: '2035-01-01T00:00:00Z'
                          lastUpdatedAt:
                            description: Timestamp when the immunization record was last updated (ISO 8601)
                            type: string
                            example: '2025-08-19T15:31:35Z'
                          lastUpdatedBy:
                            description: ID of the user who last updated this record
                            type: integer
                            format: int64
                            example: '1838'
                        type: object
                    type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/pets/{petId}/pet-notes:
    post:
      tags:
      - Pets
      summary: Pet Employee Notes - Create
      description: Creates a new internal staff note on a specific pet's profile. Employee notes are private records visible only to staff — not to the pet owner. Use these to log behavioral observations, care instructions, incident reports, or any other pet-specific information that staff should be aware of across future visits.
      operationId: PetEmployeeNoteCreate
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: petId
        in: path
        description: Pet ID (valid Pet ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2899'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              required:
              - locationId
              - noteTypeId
              - note
              properties:
                data:
                  properties:
                    type:
                      type: string
                      example: pet-notes
                    attributes:
                      properties:
                        locationId:
                          description: Location ID (should be valid active location ID)
                          type: integer
                          format: int64
                          example: '1'
                        noteTypeId:
                          description: Note type ID (should be valid animal note type ID)
                          type: integer
                          format: int64
                          example: '1'
                        note:
                          description: Note content (max 500 characters)
                          type: string
                          example: Pet is allergic to chicken
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful response with pet employee note data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: pet-notes
                      id:
                        description: Unique resource identifier
                        type: integer
                        format: int64
                        example: '123'
                      attributes:
                        properties:
                          petId:
                            description: ID of the pet this note belongs to
                            type: integer
                            format: int64
                            example: '2899'
                          noteType:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the note type
                                type:
                                - string
                                - 'null'
                                example: General
                            type: object
                          note:
                            description: Staff note content
                            type:
                            - string
                            - 'null'
                            example: Pet is allergic to chicken
                          createdBy:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the staff member who created the note
                                type:
                                - string
                                - 'null'
                                example: Partner API
                            type: object
                          createdAt:
                            description: ISO 8601 timestamp of when the note was created
                            type: string
                            example: '2026-04-07T17:24:53Z'
                          location:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the location
                                type:
                                - string
                                - 'null'
                                example: Main Location - New York
                            type: object
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Pet employee note added successfully
                    type: object
                type: object
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/pets/{petId}/pet-notes/{noteId}:
    put:
      tags:
      - Pets
      summary: Pet Employee Notes - Update
      description: Updates the content of an existing staff note on a specific pet's profile. Use this to correct or append information to a previously recorded observation or care instruction. Both the pet ID and note ID must be valid. Returns 404 if either does not exist.
      operationId: PetEmployeeNoteUpdate
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: petId
        in: path
        description: Pet ID (valid Pet ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '2899'
      - name: noteId
        in: path
        description: Employee Note ID (valid Pet Employee Note ID)
        required: true
        schema:
          type: integer
          format: int64
          example: '123'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    type:
                      type: string
                      example: pet-notes
                    id:
                      type: integer
                      format: int64
                      example: '123'
                    attributes:
                      properties:
                        noteTypeId:
                          description: Optional. Note type ID (should be valid animal note type ID)
                          type: integer
                          format: int64
                          example: '1'
                        note:
                          description: Optional. Note content (max 500 characters)
                          type: string
                          example: Updated pet note
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Successful response with updated pet employee note data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: pet-notes
                      id:
                        description: Unique resource identifier
                        type: integer
                        format: int64
                        example: '123'
                      attributes:
                        properties:
                          petId:
                            description: ID of the pet this note belongs to
                            type: integer
                            format: int64
                            example: '2899'
                          noteType:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the note type
                                type:
                                - string
                                - 'null'
                                example: General
                            type: object
                          note:
                            description: Staff note content
                            type:
                            - string
                            - 'null'
                            example: Updated pet note
                          updatedBy:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the staff member who last updated the note
                                type:
                                - string
                                - 'null'
                                example: Partner API
                            type: object
                          updatedAt:
                            description: ISO 8601 timestamp of when the note was last updated
                            type: string
                            example: '2026-04-07T17:24:53Z'
                          location:
                            properties:
                              id:
                                description: Unique resource identifier
                                type: integer
                                format: int64
                                example: '1'
                              name:
                                description: Display name of the location
                                type:
                                - string
                                - 'null'
                                example: Main Location - New York
                            type: object
                        type: object
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Pet employee note updated successfully
                    type: object
                type: object
        '404':
          description: Pet or note not found
        '422':
          $ref: '#/components/responses/ValidationResponse'
      security:
      - XApiKey: []
  /v1/pets:
    get:
      tags:
      - Pets
      summary: Pets - List
      description: Returns a paginated list of animals (pets) registered in the organization. Filter by parent email, home phone, cell phone, or pet name to narrow results. Each result includes the pet's basic profile data and its linked parent ID. At least one filter parameter is required to prevent returning the entire dataset.
      operationId: getPetsList
      parameters:
      - name: subdomain
        in: header
        description: Organization subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Accept
        in: header
        description: Content type acceptance header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: filter
        in: query
        description: Filter parameters
        required: false
        schema:
          properties:
            parentEmail:
              description: Optional. Filter by parent email (max 255 characters)
              type: string
              example: mgalla@togetherwork.com
            parentHomePhone:
              description: Optional. Filter by parent home phone (max 20 characters)
              type: string
              example: 184 493 0526
            parentCellPhone:
              description: Optional. Filter by parent cell phone (max 20 characters)
              type: string
              example: 184 493 0526
            petName:
              description: Optional. Filter by pet name (min 2, max 255 characters)
              type: string
              example: Leo
            speciesIds:
              description: Optional. Filter by species IDs
              type: array
              items:
                type: integer
                format: int64
              example:
              - 1
            breedIds:
              description: Optional. Filter by breed IDs
              type: array
              items:
                type: integer
                format: int64
              example:
              - 362
            petSex:
              description: 'Optional. Filter by pet sex (allowed: M, F, U)'
              type: string
              example: F
            altered:
              description: Optional. Filter by altered status (true/false)
              type: string
              example: 'false'
            created:
              description: Optional. Filter by creation date range
              properties:
                from:
                  description: Start date (YYYY-MM-DD format)
                  type: string
                  example: '2022-04-02'
                to:
                  description: End date (YYYY-MM-DD format)
                  type: string
                  example: '2023-04-02'
              type: object
            birthday:
              description: Optional. Filter by birthday date range
              properties:
                from:
                  description: Start date (YYYY-MM-DD format)
                  type: string
                  example: '2021-01-01'
                to:
                  description: End date (YYYY-MM-DD format)
                  type: string
                  example: '2021-01-31'
              type: object
            vetIds:
              description: Optional. Filter by vet IDs
              type: array
              items:
                type: integer
                format: int64
              example:
              - 35
            parentIds:
              description: Optional. Filter by parent IDs
              type: array
              items:
                type: integer
                format: int64
              example:
              - 2547
            active:
              description: Optional. Filter by active status (true/false)
              type: string
              example: 'true'
          type: object
      - name: page
        in: query
        description: Pagination parameters
        required: false
        schema:
          properties:
            size:
              description: Number of items per page
              type: integer
              enum:
              - 10
              - 25
              - 50
              - 100
              example: 10
            number:
              description: 'Page number (min: 1, max: 999999999999999999)'
              type: integer
              maximum: 999999999999999999
              minimum: 1
              example: 1
          type: object
      responses:
        '200':
          description: Successful response with pets data
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        description: JSON:API specification version in use
                        type: string
                        example: '1.0'
                    type: object
                  meta:
                    properties:
                      currentPage:
                        description: Current page number
                        type: integer
                        format: int64
                        example: '1'
                      lastPage:
                        description: Last available page number
                        type: integer
                        format: int64
                        example: '1'
                      perPage:
                        description: Number of records per page
                        type: integer
                        format: int64
                        example: '10'
                      total:
                        description: Total number of records across all pages
                        type: integer
                        format: int64
                        example: '1'
                    type: object
                  links:
                    properties:
                      first:
                        description: URL to the first page of results
                        type: string
                        example: http://localhost/v1/pets?page[number]=1&page[size]=10
                      last:
                        description: URL to the last page of results
                        type: string
                        example: http://localhost/v1/pets?page[number]=1&page[size]=10
                      prev:
                        description: URL to the previous page of results
                        type: string
                        example: ''
                      next:
                        description: URL to the next page of results
                        type: string
                        example: ''
                    type: object
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          description: JSON:API resource type identifier
                          type: string
                          example: pets
                        id:
                          description: Unique resource identifier
                          type: integer
                          format: int64
                          example: '2778'
                        attributes:
                          properties:
                            name:
                              description: Name of the pet
                              type: string
                              example: LEO
                            breed:
                              properties:
                                id:
                                  description: Unique identifier of the breed
                                  type: integer
                                  format: int64
                                  example: '362'
                                name:
                                  description: Name of the breed
                                  type: string
                                  example: Afghan Hound
                              type: object
                            sex:
                              description: Sex of the pet (Male, Female, or Unknown)
                              type: string
                              example: Female
                            birthday:
                              description: Date of birth of the pet in YYYY-MM-DD format
                              type: string
                              example: '2021-01-01'
                            active:
                              description: Whether the pet profile is currently active
                              type: boolean
                              example: true
                            weight:
                              description: Weight of the pet in pounds
                              type: integer
                              format: int64
                              example: '25'
                            vip:
                              description: Whether the pet is flagged as a VIP client
                              type: boolean
                              example: true
                            medicines:
                              description: Medication information for the pet
                              type: string
                              example: ''
                            allergies:
                              description: Known allergy information for the pet
                              type: string
                              example: <p>tesztAlbruto</p>
                            image:
                              description: URL of the pet's profile photo
                              type: string
                              example: https://storage.googleapis.com/gingr-app-user-uploads//2025/02/03/803ebc3b-68c2-4fb0-9eae-d71ba9b8e3a6-test.jpg
                            petCreatedDate:
                              description: Date the pet record was created in YYYY-MM-DD format
                              type: string
                              example: '2022-04-27'
                            species:
                              properties:
                                id:
                                  description: Unique identifier of the species
                                  type: integer
                                  format: int64
                                  example: '1'
                                name:
                                  description: Name of the species
                                  type: string
                                  example: Dog
                              type: object
                            altered:
                              description: Whether the pet has been spayed or neutered
                              type: boolean
                              example: false
                            parent:
                              properties:
                                id:
                                  description: Unique identifier of the pet's owner/parent
                                  type: integer
                                  format: int64
                                  example: '2422'
                                firstName:
                                  description: First name of the parent/owner
                                  type: string
                                  example: Mounica galla
                                lastName:
                                  description: Last name of the parent/owner
                                  type: string
                                  example: G
                                email:
                                  description: Email address of the parent/owner
                                  type: string
                                  example: mgalla@togetherwork.com
                                cellPhone:
                                  description: Mobile/cell phone number of the parent/owner
                                  type: string
                                  example: 184 493 0526
                                homePhone:
                                  description: Home phone number of the parent/owner
                                  type: string
                                  example: 184 493 0526
                                homeLocationId:
