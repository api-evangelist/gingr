          required:
          - locationIds
          - dateRanges
          properties:
            locationIds:
              description: Location IDs (required, at least one)
              type: array
              items:
                type: integer
              example:
              - 1
            speciesIds:
              description: Optional. Filter by species IDs
              type: array
              items:
                type: integer
              example:
              - 1445
              - 156
              - 1
            bookingTypeIds:
              description: Optional. Filter by booking type IDs
              type: array
              items:
                type: integer
              example:
              - 1
              - 2
              - 3
            parentIds:
              description: Optional. Filter by parent IDs
              type: array
              items:
                type: integer
              example:
              - 1
            petIds:
              description: Optional. Filter by pet IDs
              type: array
              items:
                type: integer
              example:
              - 1
              - 2
            expiresWithin:
              description: 'Optional. Number of days within which immunizations expire (minimum: 0)'
              type: integer
              example: 10
            required:
              description: Optional. Filter by required immunizations only (true/false)
              type: boolean
              example: true
