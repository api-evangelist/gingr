  /v1/pets/merge:
    post:
      tags:
      - Pets
      summary: Pets - Merge
      description: Merge two pets belonging to the same parent. All related records from the old pet will be transferred to the new pet, and the old pet will be deleted.
      operationId: v1PetsMerge
      parameters:
      - name: subdomain
        in: header
        description: Subdomain identifier
        required: true
        schema:
          type: string
          example: donny
      - name: Content-Type
        in: header
        description: Content-Type header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      - name: Accept
        in: header
        description: Accept header
        required: true
        schema:
          type: string
          example: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              required:
              - data
              properties:
                jsonapi:
                  properties:
                    version:
                      type: string
                      example: '1.0'
                  type: object
                data:
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      description: JSON:API resource type identifier
                      type: string
                      example: pets
                    attributes:
                      required:
                      - oldId
                      - newId
                      properties:
                        oldId:
                          description: Pet ID to be merged (should be valid pet ID)
                          type: integer
                          example: 2384
                        newId:
                          description: Target pet ID (should be valid pet ID)
                          type: integer
                          example: 1371
                      type: object
                  type: object
              type: object
      responses:
        '200':
          description: Pets merged successfully
          content:
            application/vnd.api+json:
              schema:
                properties:
                  jsonapi:
                    properties:
                      version:
                        type: string
                        example: '1.0'
                    type: object
                  data:
                    properties:
                      type:
                        description: JSON:API resource type identifier
                        type: string
                        example: pets
                    type: object
                  meta:
                    properties:
                      message:
                        description: Human-readable status message
                        type: string
                        example: Pets merged successfully
                    type: object
                type: object
        '404':
          description: One or both pets not found
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        status:
                          type: string
                          example: '404'
                        title:
                          type: string
                          example: One or both pets not found.
                      type: object
                type: object
        '422':
          description: Validation error or business rule violation — e.g. pets must have the same parent to merge, or old and new pet IDs cannot be the same.
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        status:
                          type: string
                          example: '422'
                        title:
                          type: string
                          example: Pets must have the same parent to merge.
                      type: object
                type: object
        '500':
          description: Internal server error during merge operation
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        status:
                          type: string
                          example: '500'
                        title:
                          type: string
                          example: Pets merge failed
                      type: object
                type: object
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - status: 400
                  title: Bad Request
                  detail: Pets merge failed
      security:
      - XApiKey: []
