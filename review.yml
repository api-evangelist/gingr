aid: gingr
name: Gingr
review:
  question: Does Gingr expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Gingr's public Partner API surface
    (api.gingr.io, documented at docs.gingr.io/documentation) is entirely
    request/response REST over HTTPS in a JSON:API-flavored shape - there is
    no server-push transport (WebSocket or SSE) documented anywhere in the
    live OpenAPI/Swagger spec, the accompanying Postman collection, or the
    Zendesk support articles describing the API. There is nothing resembling
    a streaming or realtime channel to model as AsyncAPI.
  findings:
    summary: |
      Gingr does not publish a documented public WebSocket API. Gingr is
      pet-care business management software for dog daycare, boarding,
      training, and grooming facilities. It exposes a genuine, actively
      maintained Partner API at https://api.gingr.io (Gingr API v1.8.0),
      documented with a live public OpenAPI 3.0/Swagger document at
      https://docs.gingr.io/documentation/swagger.json, a Redoc view, and a
      downloadable Postman collection plus environment. As of this review the
      spec documents 158 request/response REST operations covering owners
      ("parents"), pets, bookings/reservations, invoices, payments,
      immunizations, report cards, and extensive facility configuration.
      Requests use a JSON:API content type (application/vnd.api+json),
      require an X-Api-Key header issued per account plus a subdomain header
      identifying the facility, and return JSON. No ws:// or wss:// endpoint,
      Server-Sent Events endpoint, or webhook subscription mechanism is
      documented on this API. Gingr also references an older, simpler
      subdomain-scoped legacy API (https://{subdomain}.gingrapp.com/api/v1/...
      with an API key passed as a query parameter) in its Zendesk knowledge
      base, described there as read-only; it is likewise plain HTTPS
      request/response with no realtime transport.
    openSource: |
      Gingr is closed-source, proprietary vertical SaaS. There is no public
      SDK, CLI, or open-source client library; integrators call the REST API
      directly or use the published Postman collection.
    transports:
      - protocol: REST
        scheme: https
        baseURL: https://api.gingr.io
        documented: true
        note: >-
          Partner API, JSON:API-flavored (application/vnd.api+json). Live
          OpenAPI 3.0 document at
          https://docs.gingr.io/documentation/swagger.json, 158 operations as
          of this review (Gingr API v1.8.0). Auth via X-Api-Key + subdomain
          headers.
      - protocol: REST (legacy)
        scheme: https
        baseURL: https://{subdomain}.gingrapp.com/api/v1
        documented: true
        note: >-
          Older, simpler subdomain-hosted reporting API referenced in Gingr's
          Zendesk knowledge base; API key passed as a query parameter;
          described there as read-only.
      - protocol: WebSocket
        scheme: wss
        documented: false
        note: No WebSocket endpoint is documented anywhere in Gingr's Partner API spec, Postman collection, or support articles as of the review date.
