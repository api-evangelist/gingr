actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push transport exists on either Gingr API
    generation - both the current JSON:API Partner API at api.gingr.io and
    the older subdomain-scoped legacy API are plain request/response REST
    over HTTPS. No AsyncAPI document was created because there is no
    streaming surface on Gingr's own API to model.
