meters:
- name: facility_subscription
  description: Flat monthly subscription fee per facility/location, tiered by Spa/Play/Stay line of business.
  unit: facilities
  aggregation: sum
  dimensions:
  - account
  - location
- name: payment_processing_volume
  description: Payment volume processed through Gingr's integrated payments add-on, when enabled.
  unit: USD
  aggregation: sum
  dimensions:
  - account
  - location
- name: addon_subscriptions
  description: Optional add-ons billed separately from the base subscription (two-way SMS, employee scheduling, messaging bundles).
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
  - addon
- name: partner_api_usage
  description: Partner API call volume against api.gingr.io. Not separately metered or billed by Gingr as of the review date; tracked here for internal visibility only.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
principles:
- name: Visibility
  description: Track the per-facility subscription tier and any enabled add-ons (payments, SMS, scheduling) against actual usage per location.
- name: Allocation
  description: Allocate the monthly subscription and payment-processing costs to the specific facility/subdomain, since Gingr bills and scopes API keys per location.
- name: Optimization
  description: Right-size the tier (Spa vs Play vs Stay) to the services a facility actually offers, and evaluate whether Gingr's integrated payments discount versus a third-party processor is net-cheaper.
- name: Accountability
  description: Assign an owner per facility/location for the Gingr subscription and its add-ons, especially for multi-location operators with custom enterprise packages.
