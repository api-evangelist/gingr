description: >-
  FinOps view of Gingr spend. Gingr is billed as a flat per-facility monthly
  software subscription (tiered by Spa/grooming, Play/daycare, or Stay/boarding
  line of business), not metered by API call volume - the Partner API ships
  as part of the subscription at no separate charge. The larger variable cost
  driver for most facilities is payment processing volume when using Gingr's
  integrated payments add-on, plus optional add-ons like two-way SMS and
  employee scheduling.
notes: >-
  Per-tier and per-location rates are not reconciled here; verify current
  pricing directly with Gingr. For multi-location operators, allocate the
  subscription cost per facility/subdomain since each location is a distinct
  billable unit and a distinct API-key scope.
